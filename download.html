<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل تطبيق تسعيرتي DZ</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
    }
    .container {
      max-width: 450px;
      margin: 40px auto;
      background: #ffffff;
      padding: 35px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .logo {
      width: 85px;
      height: 85px;
      background: #198754;
      color: #fff;
      font-size: 34px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      margin: 0 auto 20px;
      box-shadow: 0 4px 12px rgba(25,135,84,0.3);
    }
    h1 { font-size: 24px; margin-bottom: 10px; color: #212529; }
    p { font-size: 15px; color: #6c757d; margin-bottom: 25px; line-height: 1.6; }
    .btn {
      background: #198754;
      color: #fff;
      border: none;
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(25,135,84,0.35);
      margin-bottom: 15px;
      transition: background 0.2s;
    }
    .btn:active { background: #157347; }
    .manual-box {
      font-size: 13px; 
      color: #0f5132; 
      background: #d1e7dd; 
      padding: 14px; 
      border-radius: 10px; 
      margin-top: 15px;
      line-height: 1.5;
    }
    .footer-link {
      display: inline-block;
      margin-top: 20px;
      color: #198754;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .footer-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">DZ</div>
    <h1>تطبيق تسعيرتي DZ</h1>
    <p>اطلب تسعيرة من محلات ولايتك وقارن الأسعار قبل الشراء مباشرة من هاتفك بكل سهولة.</p>
    
    <button id="install-btn" class="btn" style="display:none;">📲 تثبيت التطبيق على الشاشة الرئيسية</button>
    
    <div id="manual-msg" class="manual-box">
      💡 <b>طريقة التثبيت السريع:</b> اضغط على نقاط المتصفح (⋮) في الأعلى ثم اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.
    </div>

    <a href="/" class="footer-link">← العودة إلى الصفحة الرئيسية</a>
  </div>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-btn');
      installBtn.style.display = 'block';
      
      installBtn.addEventListener('click', () => {
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      });
    });
  </script>

</body>
</html>
