<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل تطبيق تسعيرتي DZ</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
    }
    .container {
      max-width: 450px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .logo {
      width: 80px;
      height: 80px;
      background: #0d6efd;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; color: #111; }
    p { font-size: 14px; color: #666; margin-bottom: 25px; line-height: 1.6; }
    .btn {
      background: #0d6efd;
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(13,110,253,0.3);
      margin-bottom: 15px;
    }
    .btn:active { background: #0b5ed7; }
    .footer-link {
      display: inline-block;
      margin-top: 15px;
      color: #0d6efd;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">DZ</div>
    <h1>تطبيق تسعيرتي DZ</h1>
    <p>احصل على أسرع تجربة لطلب التسعيرات من محلات ولايتك ومقارنة الأسعار مباشرة من هاتفك.</p>
    
    <button id="install-btn" class="btn" style="display:none;">📲 تثبيت التطبيق على الشاشة الرئيسية</button>
    
    <div id="manual-msg" style="font-size: 13px; color: #555; background: #e7f1ff; padding: 12px; border-radius: 8px; margin-top: 10px;">
      💡 لتثبيت التطبيق يدوياً: اضغط على نقاط المتصفح (⋮) ثم اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.
    </div>

    <a href="/" class="footer-link">← العودة إلى الرئيسية</a>
  </div>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-btn');
      installBtn.style.display = 'block';
      
      installBtn.addEventListener('click', () => {
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      });
    });
  </script>

</body>
</html>
