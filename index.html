  <script>
    const WILAYAS = [
      "01 - أدرار", "02 - الشلف", "03 - الأغواط", "04 - أم البواقي", "05 - باتنة", "06 - بجاية",
      "07 - بسكرة", "08 - بشار", "09 - البليدة", "10 - البويرة", "11 - تمنراست", "12 - تبسة",

      "19 - سطيف", "20 - سعيدة", "21 - سكيكدة", "22 - سيدي بلعباس", "23 - عنابة", "24 - قالمة",
      "25 - قسنطينة", "26 - المدية", "27 - مستغانم", "28 - المسيلة", "29 - معسكر", "30 - ورقلة",

      "37 - تندوف", "38 - تيسمسيلت", "39 - الوادي", "40 - خنشلة", "41 - سوق أهراس", "42 - تيبازة",

      "54 - عين قزام", "55 - تقرت", "56 - جانت", "57 - المغير", "58 - المنيعة"
    ];

    const CATEGORIES = {
      supermarket: { name: 'المواد الغذائية والتنظيف', short: 'سوبرماركت', icon: '🛒', suggestions: ['زيت المائدة 5ل', 'سكر 5كغ', 'قهوة 250غ', 'سائل غسيل الملابس', 'حفاضات أطفال'] },
      building: { name: 'مواد البناء والترميم', short: 'مواد البناء', icon: '🧱', suggestions: ['إسمنت 50كغ', 'حديد تسليح 12مم', 'رمل بناء', 'حصى', 'طلاء مائي'] },
      auto: { name: 'قطع غيار السيارات', short: 'قطع الغيار', icon: '🚗', suggestions: ['صفائح الفرامل', 'فلتر زيت', 'طقم التوزيع', 'بطارية 60Ah'] },
      appliances: { name: 'الأجهزة الكهرومنزلية', short: 'كهرومنزلية', icon: '🔌', suggestions: ['مكيف هواء', 'ثلاجة', 'غسالة ملابس', 'تلفاز ذكي'] }
    };

    let sb = null;
    let currentUser = null;
    let currentProfile = null;
    let authMode = 'login';
    let currentTab = 'home';
    let selectedCategory = 'supermarket';
    let draftItems = [];
    let draftImageBase64 = null;
    let draftAvatarBase64 = null;
    let editAvatarBase64 = null;
    let myRequests = [];
    let openRequests = [];
    let flashDeals = [];
    let historyRequests = [];
    let showAllWilayas = false;

    function formatDzWhatsApp(phone) {
      if (!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '213' + clean.substring(1);
      else if (!clean.startsWith('213')) clean = '213' + clean;
      return clean;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function populateWilayas() {
      document.querySelectorAll('.wilaya-select').forEach(sel => {
        const curVal = sel.value;
        sel.innerHTML = WILAYAS.map(w => `<option value="${w}">${w}</option>`).join('');
        if (curVal) sel.value = curVal;
      });
    }

    async function requestNotificationPermission() {
      if (!("Notification" in window)) {
        return showToast('متصفحك لا يدعم الإشعارات الفورية', true);
      }
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        showToast('✅ تم تفعيل الإشعارات الفورية بنجاح!');
        new Notification("تسعيرتي DZ", { body: "تم تفعيل تنبيهات العروض والطلبات بنجاح!", icon: "https://via.placeholder.com/128" });
      } else {
        showToast('يرجى السماح بالإشعارات من إعدادات المتصفح', true);
      }
    }

    function triggerBackgroundNotification(title, body) {
      if (Notification.permission === "granted") {
        try {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body: body,
              icon: "https://via.placeholder.com/128",
              badge: "https://via.placeholder.com/128",
              vibrate: [200, 100, 200]
            });
          }).catch(() => {
            new Notification(title, { body });
          });
        } catch (e) {
          new Notification(title, { body });
        }
      }
    }

    function requestUserGPSLocation() {
      if (!navigator.geolocation) return showToast('متصفحك لا يدعم تحديد الموقع', true);
      showToast('📍 جاري تحديد موقعك الفعلي المباشر...');
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        if (currentProfile) {
          await sb.from('profiles').update({ latitude: lat, longitude: lon }).eq('id', currentProfile.id);
          currentProfile.latitude = lat;
          currentProfile.longitude = lon;
        }
        showToast('✅ تم تثبيت موقعك المباشر بنجاح!');
      }, (error) => {
        showToast('يرجى السماح بالوصول للموقع من المتصفح', true);
      }, { timeout: 10000 });
    }

    async function viewUserProfile(userId) {
      const { data: userData, error } = await sb.from('profiles').select('*').eq('id', userId).single();
      if (error || !userData) return showToast('تعذر تحميل الملف الشخصي', true);

      const { data: reviewsData } = await sb.from('merchant_reviews').select('*, profiles:customer_id(full_name)').eq('merchant_id', userId).order('created_at', { ascending: false });
      const reviews = reviewsData || [];
      let avgRating = 5;
      if (reviews.length > 0) {
        const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
        avgRating = (sum / reviews.length).toFixed(1);
      }

      const isMer = userData.role === 'merchant';
      const avatarH = userData.avatar_url 
        ? `<img src="${userData.avatar_url}" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-emerald-500 shadow-sm mb-2">`
        : `<div class="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full mx-auto flex items-center justify-center text-3xl font-extrabold mb-2">${isMer ? '🏪' : '👤'}</div>`;

      const waPhone = formatDzWhatsApp(userData.phone || '');

      document.getElementById('modal-profile-body').innerHTML = `
        ${avatarH}
        <h3 class="font-extrabold text-base text-gray-900">${userData.shop_name || userData.full_name}</h3>
        <div class="flex items-center justify-center gap-1 my-1">
          <span class="text-amber-500 font-extrabold">★ ${reviews.length > 0 ? avgRating : '5.0'}</span>
          <span class="text-xs text-gray-400">(${reviews.length} تقييمات)</span>
        </div>
        
        <div class="mt-3 text-right space-y-1.5 bg-gray-50 p-3 rounded-xl text-xs">
          <div class="flex justify-between"><span class="text-gray-400">الاسم:</span><span class="font-bold">${userData.full_name}</span></div>
          ${isMer ? `<div class="flex justify-between"><span class="text-gray-400">التخصص:</span><span class="font-bold">${userData.category || '-'}</span></div>` : ''}
          <div class="flex justify-between"><span class="text-gray-400">المنطقة:</span><span class="font-bold">${userData.wilaya} ${userData.municipality ? '- ' + userData.municipality : ''}</span></div>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-3">
          <a href="tel:${userData.phone || ''}" class="bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold text-center">📞 اتصال</a>
          <a href="https://wa.me/${waPhone}" target="_blank" class="bg-[#25D366] text-white py-2 rounded-xl text-xs font-bold text-center">💬 واتساب</a>
        </div>

        ${isMer ? `
          <div class="mt-4 pt-3 border-t border-gray-100 text-right">
            <h4 class="font-bold text-xs text-gray-700 mb-2">آراء الزبائن:</h4>
            <div class="space-y-2 max-h-36 overflow-y-auto hide-scroll">
              ${reviews.length === 0 ? `<p class="text-[11px] text-gray-400 text-center py-2">لا توجد تقييمات حتى الآن</p>` :
                reviews.map(rev => `
                  <div class="bg-gray-50 p-2 rounded-lg border border-gray-100 text-[11px]">
                    <div class="flex justify-between font-bold text-gray-800">
                      <span>${rev.profiles?.full_name || 'زبون'}</span>
                      <span class="text-amber-500">${'★'.repeat(rev.rating)}</span>
                    </div>
                    <p class="text-gray-600 mt-1">${rev.comment || 'بدون تعليق'}</p>
                  </div>
                `).join('')
              }
            </div>

            ${currentProfile.role === 'customer' ? `
              <div class="mt-3 bg-emerald-50/50 p-2.5 rounded-xl border border-emerald-100 space-y-2">
                <div class="text-[11px] font-bold text-emerald-800">أضف تقييمك لهذا التاجر:</div>
                <div class="flex gap-1 justify-center">
                  <select id="new-rating" class="px-2 py-1 rounded border text-xs bg-white">
                    <option value="5">⭐⭐⭐⭐⭐ (ممتاز)</option>
                    <option value="4">⭐⭐⭐⭐ (جيد جداً)</option>
                    <option value="3">⭐⭐⭐ (متوسط)</option>
                    <option value="2">⭐⭐ (ضعيف)</option>
                    <option value="1">⭐ (سيء)</option>
                  </select>
                </div>
                <input id="new-comment" type="text" placeholder="اكتب تعليقك هنا..." class="w-full px-2 py-1.5 rounded border border-gray-200 text-xs bg-white outline-none">
                <button onclick="submitReview('${userId}')" class="w-full bg-emerald-600 text-white py-1.5 rounded text-xs font-bold">إرسال التقييم</button>
              </div>
            ` : ''}
          </div>
        ` : ''}
      `;
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    async function submitReview(merchantId) {
      const rating = Number(document.getElementById('new-rating').value);
      const comment = document.getElementById('new-comment').value.trim();

      const { error } = await sb.from('merchant_reviews').insert({
        merchant_id: merchantId,
        customer_id: currentProfile.id,
        rating,
        comment
      });

      if (error) {
        showToast('خطأ في إرسال التقييم: ' + error.message, true);
      } else {
        showToast('تم إضافة تقييمك بنجاح!');
        closeProfileModal();
      }
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    async function initApp() {
      try {
        populateWilayas();
        // التحقق من تحميل مكتبة Supabase
        if (typeof window.supabase === 'undefined') {
          throw new Error('تعذر تحميل مكتبة الاتصال، تحقق من الإنترنت');

        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if (session) {
          currentUser = session.user;
          await loadUserProfile();

          showAuthView();
        }
      } catch (err) {
        showAuthView();
      }
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          draftAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('avatar-preview-container').innerHTML = `<img src="${draftAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleEditAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          editAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          const previewEl = document.getElementById('edit-avatar-preview');
          if (previewEl) previewEl.innerHTML = `<img src="${editAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const phone = document.getElementById('auth-phone').value.trim().replace(/\s+/g, '');
      const password = document.getElementById('auth-password').value;
      const fakeEmail = `${phone}@tasairati.dz`;
      const btn = document.getElementById('auth-submit-btn');
      btn.disabled = true;
      btn.textContent = 'جاري المعالجة...';

      try {
        if (authMode === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
          if (error) throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة');
          currentUser = data.user;
          await loadUserProfile();
        } else {
          const fullName = document.getElementById('reg-name').value.trim();
          const role = document.querySelector('input[name="role"]:checked').value;
          const wilaya = document.getElementById('reg-wilaya').value;
          const municipality = document.getElementById('reg-municipality').value.trim();
          const shopName = document.getElementById('reg-shop').value.trim();
          const category = document.getElementById('reg-category').value;

          if (!fullName) throw new Error('يرجى كتابة الاسم الكامل');
          if (role === 'merchant' && !shopName) throw new Error('يرجى كتابة اسم المحل التجاري');

          const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
          if (error) throw new Error(error.message);
          if (!data.user) throw new Error('تأكد من إيقاف Confirm email في إعدادات Supabase');

          const { error: profErr } = await sb.from('profiles').insert({
            id: data.user.id,
            full_name: fullName,
            phone: phone,
            role: role,
            wilaya: wilaya,
            municipality: municipality,
            shop_name: role === 'merchant' ? shopName : null,
            category: role === 'merchant' ? category : null,
            avatar_url: draftAvatarBase64
          });
          if (profErr) throw new Error('خطأ في حفظ الملف: ' + profErr.message);

          currentUser = data.user;
          showToast('تم إنشاء حسابك بنجاح!');
          requestUserGPSLocation();
          await loadUserProfile();
        }
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'signup' ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق';
      }
    }

    async function loadUserProfile() {
      const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (error || !data) {
        showAuthView();
        return;
      }
      currentProfile = data;
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      const isMerchant = currentProfile.role === 'merchant';
      document.getElementById('role-badge').textContent = isMerchant ? 'حساب تاجر' : 'حساب زبون';
      document.getElementById('header-subtitle').textContent = isMerchant
        ? `${currentProfile.shop_name} • ${currentProfile.wilaya}`
        : `مرحبًا ${currentProfile.full_name} • ${currentProfile.wilaya}`;

      const avatarContainer = document.getElementById('header-avatar');
      if (currentProfile.avatar_url) {
        avatarContainer.innerHTML = `<img src="${currentProfile.avatar_url}" class="w-full h-full object-cover">`;
      } else {
        avatarContainer.textContent = isMerchant ? '🏪' : '👤';

      setupNav();
      currentTab = 'home';
      await loadAllData();
      setupRealtimeListeners();

    function setupRealtimeListeners() {
      sb.channel('public-db-changes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'flash_deals' }, payload => {
          const newDeal = payload.new;
          if (newDeal.wilaya === currentProfile.wilaya) {
            triggerBackgroundNotification("🔥 عروض سريعة جديدة!", `أضف عرضاً جديداً في ${newDeal.wilaya}: ${newDeal.title} بسعر ${newDeal.price} دج`);
            loadAllData();
          }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quote_requests' }, payload => {
          const newReq = payload.new;
          if (currentProfile.role === 'merchant' && newReq.wilaya === currentProfile.wilaya && newReq.category === currentProfile.category) {
            triggerBackgroundNotification("📦 طلب تسعيرة جديد!", `طلب جديد في ${newReq.wilaya}: ${newReq.title}`);
            loadAllData();
          }
        })
        .subscribe();
    }

    async function loadAllData() {
      try {
        const { data: dealsData } = await sb.from('flash_deals').select('*, profiles(shop_name, phone, avatar_url, wilaya, municipality)').eq('wilaya', currentProfile.wilaya).order('created_at', { ascending: false });
        flashDeals = dealsData || [];

        if (currentProfile.role === 'customer') {
          const { data } = await sb
            .from('quote_requests')
            .select('*, quote_offers(*, profiles(shop_name, full_name, phone, municipality, avatar_url, category))')
            .eq('customer_id', currentProfile.id)
            .order('created_at', { ascending: false });
          myRequests = data || [];
          historyRequests = (myRequests || []).filter(r => r.status === 'accepted' || r.status === 'closed');
        } else {
          let query = sb
            .from('quote_requests')
            .select('*, profiles(id, full_name, phone, avatar_url, wilaya, municipality), quote_offers(*)')
            .order('created_at', { ascending: false });
          
          if (!showAllWilayas) {
            query = query.eq('wilaya', currentProfile.wilaya).eq('category', currentProfile.category);
          }
          const { data } = await query;
          const allReqs = data || [];
          openRequests = allReqs.filter(r => r.status === 'open');
          historyRequests = allReqs.filter(r => {
            const hasMySelectedOffer = (r.quote_offers || []).some(o => o.merchant_id === currentProfile.id && o.status === 'selected');
            return hasMySelectedOffer || r.status === 'accepted';
          });
        }
      } catch (err) {
        console.error(err);
      }
      renderCurrentTab();
    }

    async function publishFlashDeal() {
      const title = document.getElementById('deal-title').value.trim();
      const description = document.getElementById('deal-desc').value.trim();
      const price = document.getElementById('deal-price').value;
      const original_price = document.getElementById('deal-orig-price').value || null;

      if (!title || !price) return showToast('يرجى كتابة عنوان العرض السريع والسعر', true);

      const expiresAt = new Date();
      expiresAt.setDate(expiresAt.getDate() + 1);

      const { error } = await sb.from('flash_deals').insert({
        merchant_id: currentProfile.id,
        title,
        description,
        price: Number(price),
        original_price: original_price ? Number(original_price) : null,
        category: currentProfile.category || 'supermarket',
        wilaya: currentProfile.wilaya,
        expires_at: expiresAt.toISOString()
      });

      if (error) {
        showToast('خطأ في نشر العرض: ' + error.message, true);
      } else {
        showToast('⚡ تم نشر العرض السريع بنجاح وإرسال الإشعارات للزبائن!');
        document.getElementById('deal-title').value = '';
        document.getElementById('deal-desc').value = '';
        document.getElementById('deal-price').value = '';
        document.getElementById('deal-orig-price').value = '';
        await loadAllData();
      }
    }

              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">البلدية</label>
                <input id="req-municipality" type="text" value="${currentProfile.municipality || ''}" placeholder="البلدية" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none">
              </div>
            </div>

            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200/70">
              <label class="block text-xs font-bold text-gray-700 mb-2">أضف المواد المطلوبة:</label>
              <div class="flex gap-1.5 overflow-x-auto hide-scroll pb-2 mb-2">
                ${cat.suggestions.map(s => `
                  <button type="button" onclick="quickAddItem('${s}')" class="shrink-0 text-[11px] bg-white border border-emerald-200 text-emerald-700 px-2.5 py-1 rounded-full font-bold">+ ${s}</button>
                `).join('')}
              </div>
              <div class="flex gap-2">
                <input id="item-name" type="text" placeholder="اسم المادة..." class="flex-1 px-3 py-2 rounded-lg border border-gray-200 bg-white text-xs outline-none">
                <input id="item-qty" type="text" placeholder="الكمية" class="w-20 px-2.5 py-2 rounded-lg border border-gray-200 bg-white text-xs outline-none">
                <button type="button" onclick="addDraftItem()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold">إضافة</button>
              </div>
              <div id="draft-items-list" class="mt-2.5 space-y-1.5">
                ${draftItems.map((it, idx) => `
                  <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-gray-100 text-xs">
                    <span class="font-bold">${it.name} <span class="text-emerald-600">(${it.qty})</span></span>
                    <button type="button" onclick="removeDraftItem(${idx})" class="text-red-500 font-bold px-1">✕</button>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">📷 إرفاق صورة (اختياري)</label>
              <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-gray-500 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700">
              ${draftImageBase64 ? `<img src="${draftImageBase64}" class="mt-2 h-24 rounded-lg object-cover border">` : ''}
            </div>

            <button type="button" onclick="submitQuoteRequest()" id="send-req-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-md text-sm">
              🚀 إرسال طلب التسعيرة للتجار الآن
            </button>
          </div>
        </div>`;
    }

    function selectCat(cat) { selectedCategory = cat; renderCurrentTab(); }
    function quickAddItem(name) { draftItems.push({ name, qty: '1' }); renderCurrentTab(); }
    function addDraftItem() {
      const name = document.getElementById('item-name').value.trim();
      const qty = document.getElementById('item-qty').value.trim() || '1';
      if (!name) return;
      draftItems.push({ name, qty });
      renderCurrentTab();
    }
    function removeDraftItem(idx) { draftItems.splice(idx, 1); renderCurrentTab(); }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 700;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          draftImageBase64 = canvas.toDataURL('image/jpeg', 0.65);
          renderCurrentTab();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitQuoteRequest() {
      const title = document.getElementById('req-title').value.trim();
      const wilaya = document.getElementById('req-wilaya').value;
      const municipality = document.getElementById('req-municipality').value.trim();

      if (!title) return showToast('يرجى كتابة عنوان للطلب', true);

      const btn = document.getElementById('send-req-btn');
      btn.disabled = true;
      btn.textContent = 'جاري إرسال الطلب...';

      const { error } = await sb.from('quote_requests').insert({
        customer_id: currentProfile.id,
        category: selectedCategory,
        wilaya,
        municipality,
        title,
        items: draftItems,
        image_url: draftImageBase64,
        status: 'open'
      });

      if (error) {
        showToast('حدث خطأ: ' + error.message, true);
        btn.disabled = false;
        btn.textContent = '🚀 إرسال طلب التسعيرة للتجار الآن';
      } else {
        draftItems = [];
        draftImageBase64 = null;
        showToast('تم إرسال طلبك للتجار بنجاح!');
        await loadAllData();
        switchTab('orders');
      }
    }

    function renderCustomerOrders() {
      if (myRequests.length === 0) {
        return `<div class="text-center py-12 bg-white rounded-2xl border border-gray-100 p-6">
          <div class="text-4xl mb-2">📭</div>
          <p class="font-bold text-gray-700">لم ترسل أي طلب تسعيرة بعد</p>
        </div>`;
      }
      return `<div class="space-y-4">
        ${myRequests.map(req => {
          const cat = CATEGORIES[req.category] || CATEGORIES.supermarket;
          const offers = (req.quote_offers || []).sort((a, b) => Number(a.total_price) - Number(b.total_price));
          return `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <span class="text-[11px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-md">${cat.icon} ${cat.short}</span>
                  <h3 class="font-extrabold text-sm text-gray-900 mt-1">${req.title}</h3>
                </div>
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full ${offers.length > 0 ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-500'}">${offers.length} عروض</span>
              </div>
              <div class="mt-3 pt-3 border-t border-gray-100 space-y-2.5">
                ${offers.map((of, idx) => {
                  const waPhone = formatDzWhatsApp(of.profiles?.phone || '');
                  return `
                    <div class="p-3 rounded-xl border ${idx === 0 ? 'border-emerald-500 bg-emerald-50/40' : 'border-gray-200 bg-gray-50'}">
                      <div class="flex items-center justify-between">
                        <div>
                          <div class="font-extrabold text-sm text-gray-900 cursor-pointer hover:text-emerald-600" onclick="viewUserProfile('${of.merchant_id}')">${of.profiles?.shop_name || 'محل تجاري'} ⭐</div>
                        </div>
                        <div class="text-base font-extrabold text-emerald-700">${Number(of.total_price).toLocaleString()} دج</div>
                      </div>
                      <div class="grid grid-cols-2 gap-2 mt-2">
                        <a href="tel:${of.profiles?.phone || ''}" class="bg-emerald-600 text-white text-center py-1.5 rounded-lg text-xs font-bold">📞 اتصال</a>
                        <a href="https://wa.me/${waPhone}" target="_blank" class="bg-[#25D366] text-white text-center py-1.5 rounded-lg text-xs font-bold">💬 واتساب</a>
                      </div>
                    </div>`;
                }).join('')}
              </div>
            </div>`;
        }).join('')}
      </div>`;
    }

    function renderMerchantDashboard() {
      return `<div class="space-y-4">
        <div class="bg-white p-3 rounded-2xl border border-gray-100 flex justify-between items-center">
          <span class="text-xs font-bold text-gray-700">نطاق عرض الطلبات:</span>
          <button onclick="toggleWilayaScope()" class="text-xs font-bold px-3 py-1.5 rounded-xl ${showAllWilayas ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}">
            ${showAllWilayas ? '🌍 كل الولايات' : `📍 ${currentProfile.wilaya} فقط`}
          </button>
        </div>

        ${openRequests.length === 0 ? `
          <div class="text-center py-12 bg-white rounded-2xl border border-gray-100 p-6">
            <div class="text-4xl mb-2">🔎</div>
            <p class="font-bold text-gray-700 text-sm">لا توجد طلبات مفتوحة حاليًا في نطاقك</p>
          </div>` :
          openRequests.map(req => {
            const cat = CATEGORIES[req.category] || CATEGORIES.supermarket;
            const myOffer = (req.quote_offers || []).find(o => o.merchant_id === currentProfile.id);
            return `
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2.5">
                <div>
                  <span class="text-[10px] bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded-md">${cat.icon} ${cat.short}</span>
                  <h3 class="font-extrabold text-sm text-gray-900 mt-1">${req.title}</h3>
                </div>
                ${myOffer ? `<div class="bg-emerald-50 p-2 rounded-xl text-xs font-bold text-emerald-800">✅ أرسلت عرضك بقيمة: ${Number(myOffer.total_price).toLocaleString()} دج</div>` : `
                  <div class="pt-2 border-t border-gray-100 space-y-2">
                    <input type="number" id="price-${req.id}" placeholder="السعر الإجمالي (دج)" class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-emerald-50/30 text-xs font-extrabold outline-none">
                    <button onclick="sendMerchantOffer('${req.id}')" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs">إرسال التسعيرة للزبون</button>
                  </div>
                `}
              </div>`;
          }).join('')}
      </div>`;
    }

    function toggleWilayaScope() { showAllWilayas = !showAllWilayas; loadAllData(); }

    async function sendMerchantOffer(reqId) {
      const price = document.getElementById(`price-${reqId}`).value;
      if (!price || Number(price) <= 0) return showToast('أدخل السعر الإجمالي', true);

      const { error } = await sb.from('quote_offers').insert({
        request_id: reqId,
        merchant_id: currentProfile.id,
        total_price: Number(price)
      });

      if (error) showToast('خطأ: ' + error.message, true);
      else { showToast('تم إرسال تسعيرتك بنجاح!'); await loadAllData(); }
    }

    function renderProfileView() {
      const isMerchant = currentProfile.role === 'merchant';
      const avatarDisplay = editAvatarBase64 || currentProfile.avatar_url;
      const avatarHtml = avatarDisplay
        ? `<img src="${avatarDisplay}" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-emerald-500 shadow-sm mb-2">`
        : `<div class="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full mx-auto flex items-center justify-center text-3xl font-extrabold mb-2">${isMerchant ? '🏪' : '👤'}</div>`;

      return `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
          <div class="text-center pb-3 border-b border-gray-100">
            <div id="edit-avatar-preview" class="w-20 h-20 rounded-full overflow-hidden mx-auto">${avatarHtml}</div>
            <h2 class="font-extrabold text-base text-gray-900 mt-1">${currentProfile.shop_name || currentProfile.full_name}</h2>
          </div>
          <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-bold py-2.5 rounded-xl text-xs">تسجيل الخروج</button>
        </div>`;
    }

    async function handleLogout() {
      await sb.auth.signOut();
      currentUser = null;
      currentProfile = null;
      showAuthView();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
