    function formatDzWhatsApp(phone) {
      if (!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '213' + clean.substring(1);
      else if (!clean.startsWith('213')) clean = '213' + clean;
      return clean;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return null;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const d = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
      if (d < 1) return (d * 1000).toFixed(0) + ' متر';
      return d.toFixed(1) + ' كلم';
    }

    function calculateDistanceNumeric(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function formatTimeAgo(dateString) {
      if (!dateString) return '';
      const diffMs = Date.now() - new Date(dateString).getTime();
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);
      if (diffMins < 1) return 'الآن';
      if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
      if (diffHours < 24) return `منذ ${diffHours} ساعة`;
      return `منذ ${diffDays} يوم`;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function populateWilayas() {
      document.querySelectorAll('.wilaya-select').forEach(sel => {
        const curVal = sel.value;
        sel.innerHTML = WILAYAS.map(w => `<option value="${w}">${w}</option>`).join('');
        if (curVal) sel.value = curVal;
      });
    }

    async function requestNotificationPermission() {
      if (!("Notification" in window)) return showToast('متصفحك لا يدعم الإشعارات الفورية', true);
      const permission = await Notification.requestPermission();
      if (permission === "granted") showToast('✅ تم تفعيل الإشعارات الفورية بنجاح!');
      else showToast('يرجى السماح بالإشعارات من إعدادات المتصفح', true);
    }

    function triggerBackgroundNotification(title, body) {
      if (Notification.permission === "granted") {
        try { new Notification(title, { body }); } catch (e) {}
      }
    }

    function requestUserGPSLocation(silent = false) {
      if (!navigator.geolocation) return !silent && showToast('متصفحك لا يدعم تحديد الموقع', true);
      !silent && showToast('📍 جاري تحديد موقعك المباشر...');
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        if (currentProfile) {
          await sb.from('profiles').update({ latitude: lat, longitude: lon }).eq('id', currentProfile.id);
          currentProfile.latitude = lat;
          currentProfile.longitude = lon;
        }
        !silent && showToast('✅ تم تثبيت موقعك المباشر بنجاح!');
      }, (error) => {
        !silent && showToast('يرجى السماح بالوصول للموقع من المتصفح', true);
      }, { timeout: 10000 });
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          draftAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('avatar-preview-container').innerHTML = `<img src="${draftAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleEditAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          editAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          const previewEl = document.getElementById('edit-avatar-preview');
          if (previewEl) previewEl.innerHTML = `<img src="${editAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const phone = document.getElementById('auth-phone').value.trim().replace(/\s+/g, '');
      const password = document.getElementById('auth-password').value;
      const fakeEmail = `${phone}@tasairati.dz`;
      const btn = document.getElementById('auth-submit-btn');
      btn.disabled = true;
      btn.textContent = 'جاري المعالجة...';

      try {
        if (authMode === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
          if (error) throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة');
          currentUser = data.user;
          await loadUserProfile();
        } else {
          const fullName = document.getElementById('reg-name').value.trim();
          const role = document.querySelector('input[name="role"]:checked').value;
          const wilaya = document.getElementById('reg-wilaya').value;
          const municipality = document.getElementById('reg-municipality').value.trim();
          const shopName = document.getElementById('reg-shop').value.trim();
          const category = document.getElementById('reg-category').value;

          if (!fullName) throw new Error('يرجى كتابة الاسم الكامل');
          if (role === 'merchant' && !shopName) throw new Error('يرجى كتابة اسم المحل التجاري');

          const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
          if (error) throw new Error(error.message);
          if (!data.user) throw new Error('تأكد من إيقاف Confirm email في إعدادات Supabase');

          const { error: profErr } = await sb.from('profiles').insert({
            id: data.user.id,
            full_name: fullName,
            phone: phone,
            role: role,
            wilaya: wilaya,
            municipality: municipality,
            shop_name: role === 'merchant' ? shopName : null,
            category: role === 'merchant' ? category : null,
            avatar_url: draftAvatarBase64
          });
          if (profErr) throw new Error('خطأ في حفظ الملف: ' + profErr.message);

          currentUser = data.user;
          showToast('تم إنشاء حسابك بنجاح!');
          requestUserGPSLocation(true);
          await loadUserProfile();
        }
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'signup' ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق';
      }
    }

    async function loadUserProfile() {
      const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (error || !data) {
        showAuthView();
        return;
      }
      currentProfile = data;
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      const isMerchant = currentProfile.role === 'merchant';
      document.getElementById('role-badge').textContent = isMerchant ? 'حساب تاجر' : 'حساب زبون';
      document.getElementById('header-subtitle').textContent = isMerchant
        ? `${currentProfile.shop_name} • ${currentProfile.wilaya}`
        : `مرحبًا ${currentProfile.full_name} • ${currentProfile.wilaya}`;

      const avatarContainer = document.getElementById('header-avatar');
      if (currentProfile.avatar_url) {
        avatarContainer.innerHTML = `<img src="${currentProfile.avatar_url}" class="w-full h-full object-cover">`;
      } else {

    function setupRealtimeListeners() {
      sb.channel('public-requests')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quote_requests' }, payload => {
          const req = payload.new;
          if (currentProfile.role === 'merchant' && (showAllWilayas || req.wilaya === currentProfile.wilaya) && (!currentProfile.category || req.category === currentProfile.category)) {
            triggerBackgroundNotification("📦 طلب تسعيرة جديد!", `طلب جديد في ${req.wilaya} (${req.title})`);
            loadAllData();
          }
        })
        .subscribe();

      sb.channel('public-offers-deals')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quote_offers' }, payload => {
          const offer = payload.new;
          if (currentProfile.role === 'customer') {
            loadAllData();
            triggerBackgroundNotification("💰 عرض سعر جديد!", `تلقيت عرض سعر جديد بقيمة ${offer.total_price} دج`);
          }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'flash_deals' }, payload => {
          const deal = payload.new;
          if (currentProfile.role === 'customer' && deal.wilaya === currentProfile.wilaya) {
            loadAllData();
            triggerBackgroundNotification("⚡ عرض سريع جديد!", deal.title);
          }
        })
        .subscribe();
    }

      currentTab = tab;
      const tabsList = currentProfile.role === 'merchant' ? ['home', 'deals', 'history', 'profile'] : ['home', 'deals', 'merchants', 'orders', 'profile'];
      tabsList.forEach(t => {

    async function loadAllData() {
      try {
        const { data: dealsData } = await sb.from('flash_deals').select('*, profiles(shop_name, phone, avatar_url, wilaya, municipality, latitude, longitude)').eq('wilaya', currentProfile.wilaya).order('created_at', { ascending: false });
        flashDeals = dealsData || [];

        const { data: merchData } = await sb.from('profiles').select('*').eq('role', 'merchant');
        allMerchants = merchData || [];

        if (currentProfile.role === 'customer') {
          const { data } = await sb
            .from('quote_requests')
            .select('*, quote_offers(*, profiles(shop_name, full_name, phone, municipality, avatar_url, category, latitude, longitude))')
            .eq('customer_id', currentProfile.id)
            .order('created_at', { ascending: false });
          myRequests = data || [];
          historyRequests = (myRequests || []).filter(r => r.status === 'accepted' || r.status === 'closed');
        } else {
          let query = sb
            .from('quote_requests')
            .select('*, profiles(id, full_name, phone, avatar_url, wilaya, municipality, latitude, longitude), quote_offers(*)')
            .order('created_at', { ascending: false });
          
          if (!showAllWilayas) {
            query = query.eq('wilaya', currentProfile.wilaya);
          }
          const { data } = await query;
          let allReqs = data || [];
          
          if (!showAllWilayas && currentProfile.category) {
            allReqs = allReqs.filter(r => r.category === currentProfile.category || !r.category);
          }

          openRequests = allReqs.filter(r => r.status === 'open');
          historyRequests = allReqs.filter(r => {
            const hasMySelectedOffer = (r.quote_offers || []).some(o => o.merchant_id === currentProfile.id && o.status === 'selected');
            return hasMySelectedOffer || r.status === 'accepted';
          });
        }
      } catch (err) {
        console.error(err);
      }
      renderCurrentTab();
    }

    async function publishFlashDeal() {
      const title = document.getElementById('deal-title').value.trim();
      const description = document.getElementById('deal-desc').value.trim();
      const price = document.getElementById('deal-price').value;
      const hoursDuration = Number(document.getElementById('deal-duration').value);

      if (!title || !price) return showToast('يرجى كتابة عنوان العرض السريع والسعر', true);

      const expiresAt = new Date();
      expiresAt.setHours(expiresAt.getHours() + hoursDuration);

      const { error } = await sb.from('flash_deals').insert({
        merchant_id: currentProfile.id,
        title,
        description,
        price: Number(price),
        category: currentProfile.category || 'supermarket',
        wilaya: currentProfile.wilaya,
        expires_at: expiresAt.toISOString()
      });

      if (error) {
        showToast('خطأ في نشر العرض: ' + error.message, true);
      } else {
        showToast('⚡ تم نشر العرض السريع بنجاح!');
        document.getElementById('deal-title').value = '';
        document.getElementById('deal-desc').value = '';
        document.getElementById('deal-price').value = '';
        await loadAllData();
      }
    }

    async function deleteFlashDeal(dealId) {
      const { error } = await sb.from('flash_deals').delete().eq('id', dealId);
      if (!error) { showToast('تم حذف العرض بنجاح'); await loadAllData(); }

    function recalcTotal(reqId, count) {
      let sum = 0;
      for (let i = 0; i < count; i++) {
        const val = Number(document.getElementById(`item-price-${reqId}-${i}`)?.value || 0);
        if (val > 0) sum += val;
      }
      const deliveryFee = Number(document.getElementById(`fee-${reqId}`)?.value || 0);
      const total = sum + deliveryFee;
      if (total > 0) {
        document.getElementById(`price-${reqId}`).value = total;
      }
    }

    function toggleWilayaScope() { showAllWilayas = !showAllWilayas; loadAllData(); }

    async function sendMerchantOffer(reqId) {
      const price = document.getElementById(`price-${reqId}`).value;
      const deliveryFee = document.getElementById(`fee-${reqId}`).value || 0;
      if (!price || Number(price) <= 0) return showToast('أدخل السعر الإجمالي', true);

      const reqObj = openRequests.find(r => r.id === reqId);
      let pricedItems = [];
      if (reqObj && reqObj.items && reqObj.items.length > 0) {
        pricedItems = reqObj.items.map((it, idx) => ({
          name: it.name,
          qty: it.qty,
          price: Number(document.getElementById(`item-price-${reqId}-${idx}`)?.value || 0)
        }));
      }

      const { error } = await sb.from('quote_offers').insert({
        request_id: reqId,
        merchant_id: currentProfile.id,
        total_price: Number(price),
        delivery_fee: Number(deliveryFee),
        priced_items: pricedItems
      });

      if (error) showToast('خطأ: ' + error.message, true);
      else { showToast('تم إرسال تسعيرتك بنجاح!'); await loadAllData(); }
    }

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">البلدية / الحي</label>
                <input type="text" id="edit-municipality" value="${currentProfile.municipality || ''}" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm outline-none">
              </div>
            </div>

            <div class="bg-emerald-50/60 p-3 rounded-xl border border-emerald-100 flex items-center justify-between">
              <div>
                <div class="text-xs font-bold text-emerald-900">📍 موقع المحل المباشر على الخريطة</div>
                <div class="text-[11px] text-emerald-700">لتظهر للزبائن بناءً على المسافة الدقيقة</div>
              </div>
              <button type="button" onclick="requestUserGPSLocation(false)" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs font-bold">تحديث موقعي</button>
            </div>

            <button onclick="saveProfileChanges()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow-sm">
              حفظ التعديلات
            </button>
          </div>
          <div class="pt-3 border-t border-gray-100">
            <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-bold py-2.5 rounded-xl text-xs">تسجيل الخروج</button>
          </div>
        </div>`;
    }

    async function saveProfileChanges() {
      const fullName = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();
      const wilaya = document.getElementById('edit-wilaya').value;
      const municipality = document.getElementById('edit-municipality').value.trim();
      const shopName = document.getElementById('edit-shop') ? document.getElementById('edit-shop').value.trim() : null;

      if (!fullName) return showToast('يرجى كتابة الاسم الكامل', true);

      const updateData = { full_name: fullName, phone, wilaya, municipality };
      if (shopName !== null) updateData.shop_name = shopName;
      if (editAvatarBase64) updateData.avatar_url = editAvatarBase64;

      const { error } = await sb.from('profiles').update(updateData).eq('id', currentProfile.id);

      if (error) showToast('خطأ في الحفظ: ' + error.message, true);
      else { showToast('تم تحديث الملف بنجاح!'); editAvatarBase64 = null; await loadUserProfile(); }
    }

    async function handleLogout() {
      await sb.auth.signOut();
      currentUser = null;
      currentProfile = null;
      showAuthView();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
