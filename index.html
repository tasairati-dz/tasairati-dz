<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>تسعيرتي DZ — قارن الأسعار في ولايتك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f3f4f6; padding-bottom: 85px; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-gray-800 max-w-md mx-auto min-h-screen bg-gray-50 shadow-xl relative">

  <script>
    const SUPABASE_URL = 'https://ciiehtavsfaoacafwcxe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4Q7NEBUeW7EXn00rO68X6g_5bpaeOLW';

    const manifestData = {
      name: "تسعيرتي DZ",
      short_name: "تسعيرتي",
      start_url: "./",
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#059669",
      icons: [{
        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23059669'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='Arial'>DZ</text></svg>",
        sizes: "192x192",
        type: "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);
  </script>

  <!-- شريط الإشعارات العلوي -->
  <div id="toast" class="fixed top-4 left-4 right-4 max-w-md mx-auto z-50 hidden transition-all duration-300">
    <div id="toast-box" class="px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center"></div>
  </div>

  <!-- شاشة التحميل -->
  <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
    <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center text-white text-2xl font-extrabold shadow-lg mb-3 animate-bounce">DZ</div>
    <p class="text-emerald-700 font-bold text-lg">تسعيرتي DZ</p>
    <p class="text-gray-400 text-xs mt-1">جاري الاتصال بقاعدة البيانات...</p>
  </div>

  <!-- ==================== 1. شاشة تسجيل الدخول وإنشاء الحساب ==================== -->
  <div id="auth-view" class="hidden min-h-screen bg-white p-5 flex flex-col justify-center">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-extrabold shadow-md mb-3">DZ</div>
      <h1 class="text-2xl font-extrabold text-gray-900">تسعيرتي DZ</h1>
      <p class="text-sm text-gray-500 mt-1">اطلب تسعيرة من محلات ولايتك وقارن الأسعار قبل الشراء</p>
    </div>

    <div class="grid grid-cols-2 bg-gray-100 p-1 rounded-xl mb-5">
      <button id="tab-login" onclick="switchAuthMode('login')" class="py-2 rounded-lg text-sm font-bold bg-white text-emerald-700 shadow-sm">تسجيل الدخول</button>
      <button id="tab-signup" onclick="switchAuthMode('signup')" class="py-2 rounded-lg text-sm font-bold text-gray-500">حساب جديد</button>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3.5">
      <div id="signup-fields" class="hidden space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">نوع الحساب</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="role" value="customer" checked onchange="toggleMerchantFields()" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 rounded-xl p-2.5 text-center">
                <div class="text-lg">🛒</div>
                <div class="text-xs font-bold text-gray-800">زبون (مشتري)</div>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="role" value="merchant" onchange="toggleMerchantFields()" class="peer hidden">
              <div class="border-2 border-gray-200 peer-checked:border-emerald-600 peer-checked:bg-emerald-50 rounded-xl p-2.5 text-center">
                <div class="text-lg">🏪</div>
                <div class="text-xs font-bold text-gray-800">تاجر / صاحب محل</div>
              </div>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">الاسم الكامل</label>
          <input type="text" id="reg-name" placeholder="مثال: محمد بن علي" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-emerald-500 outline-none">
        </div>

        <div id="merchant-only" class="hidden space-y-3.5 bg-amber-50/70 p-3 rounded-xl border border-amber-100">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">اسم المحل التجاري</label>
            <input type="text" id="reg-shop" placeholder="مثال: سوبيرات البركة / محل الأمل لقطع الغيار" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">تخصص المحل</label>
            <select id="reg-category" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 bg-white text-sm outline-none">
              <option value="supermarket">🛒 المواد الغذائية والتنظيف (سوبرماركت)</option>
              <option value="building">🧱 مواد البناء والترميم</option>
              <option value="auto">🚗 قطع غيار السيارات</option>
              <option value="appliances">🔌 الأجهزة الكهرومنزلية</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">الولاية</label>
            <select id="reg-wilaya" class="wilaya-select w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm bg-white outline-none"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">البلدية / الحي</label>
            <input type="text" id="reg-municipality" placeholder="مثال: وسط المدينة" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">رقم الهاتف الجزائري</label>
        <input type="tel" id="auth-phone" required placeholder="0550123456" dir="ltr" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-right focus:border-emerald-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">كلمة المرور (6 أرقام أو حروف على الأقل)</label>
        <input type="password" id="auth-password" required minlength="6" placeholder="••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm focus:border-emerald-500 outline-none">
      </div>

      <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition">
        دخول إلى التطبيق
      </button>
    </form>
  </div>

  <!-- ==================== 2. التطبيق الرئيسي بعد تسجيل الدخول ==================== -->
  <div id="app-view" class="hidden">
    <header class="bg-emerald-600 text-white px-4 py-3.5 sticky top-0 z-30 shadow-sm flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-lg">تسعيرتي DZ</span>
          <span id="role-badge" class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold"></span>
        </div>
        <p id="header-subtitle" class="text-xs text-emerald-100 mt-0.5"></p>
      </div>
      <button onclick="loadAllData()" class="bg-white/15 p-2 rounded-xl text-xs font-bold active:scale-95">🔄 تحديث</button>
    </header>

    <main id="main-content" class="p-4"></main>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 px-2 py-2 flex justify-around items-center z-40">
    </nav>
  </div>

  <script>
    const WILAYAS = [
      "01 - أدرار", "02 - الشلف", "03 - الأغواط", "04 - أم البواقي", "05 - باتنة", "06 - بجاية",
      "07 - بسكرة", "08 - بشار", "09 - البليدة", "10 - البويرة", "11 - تمنراست", "12 - تبسة",
      "13 - تلمسان", "14 - تيارت", "15 - تيزي وزو", "16 - الجزائر", "17 - الجلفة", "18 - جيجل",
      "19 - سطيف", "20 - سعيدة", "21 - سكيكدة", "22 - سيدي بلعباس", "23 - عنابة", "24 - قالمة",
      "25 - قسنطينة", "26 - المدية", "27 - مستغانم", "28 - المسيلة", "29 - معسكر", "30 - ورقلة",
      "31 - وهران", "32 - البيض", "33 - إليزي", "34 - برج بوعريريج", "35 - بومرداس", "36 - الطارف",
      "37 - تندوف", "38 - تيسمسيلت", "39 - الوادي", "40 - خنشلة", "41 - سوق أهراس", "42 - تيبازة",
      "43 - ميلة", "44 - عين الدفلى", "45 - النعامة", "46 - عين تموشنت", "47 - غرداية", "48 - غليزان",
      "49 - تيميمون", "50 - برج باجي مختار", "51 - أولاد جلال", "52 - بني عباس", "53 - عين صالح",
      "54 - عين قزام", "55 - تقرت", "56 - جانت", "57 - المغير", "58 - المنيعة"
    ];

    const CATEGORIES = {
      supermarket: { name: 'المواد الغذائية والتنظيف', short: 'سوبرماركت', icon: '🛒', suggestions: ['زيت المائدة 5ل', 'سكر 5كغ', 'قهوة 250غ', 'سائل غسيل الملابس', 'حفاضات أطفال', 'حليب أطفال', 'طماطم مصبرة'] },
      building: { name: 'مواد البناء والترميم', short: 'مواد البناء', icon: '🧱', suggestions: ['إسمنت 50كغ', 'حديد تسليح 12مم', 'رمل بناء', 'حصى', 'طلاء مائي أبيض', 'أنابيب PPR', 'بلاط سيراميك'] },
      auto: { name: 'قطع غيار السيارات', short: 'قطع الغيار', icon: '🚗', suggestions: ['صفائح الفرامل (Plaquettes)', 'فلتر زيت + فلتر هواء', 'طقم التوزيع (Kit chaîne)', 'ممتص صدمات (Amortisseur)', 'بطارية 60Ah', 'شموع احتراق'] },
      appliances: { name: 'الأجهزة الكهرومنزلية', short: 'كهرومنزلية', icon: '🔌', suggestions: ['مكيف هواء 12000 BTU', 'ثلاجة نو فروست', 'غسالة ملابس أوتوماتيك', 'تلفاز ذكي 50 بوصة', 'سخان ماء 10ل', 'فرن كهربائي'] }
    };

    let sb = null;
    let currentUser = null;
    let currentProfile = null;
    let authMode = 'login';
    let currentTab = 'home';
    let selectedCategory = 'supermarket';
    let draftItems = [];
    let draftImageBase64 = null;
    let myRequests = [];
    let openRequests = [];
    let showAllWilayas = false;

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function populateWilayas() {
      document.querySelectorAll('.wilaya-select').forEach(sel => {
        sel.innerHTML = WILAYAS.map(w => `<option value="${w}" ${w.includes('28') ? 'selected' : ''}>${w}</option>`).join('');
      });
    }

    async function initApp() {
      populateWilayas();
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        currentUser = session.user;
        await loadUserProfile();
      } else {
        showAuthView();
      }
    }

    function showAuthView() {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-view').classList.add('hidden');
      document.getElementById('auth-view').classList.remove('hidden');
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      document.getElementById('signup-fields').classList.toggle('hidden', !isSignup);
      document.getElementById('tab-login').className = `py-2 rounded-lg text-sm font-bold ${!isSignup ? 'bg-white text-emerald-700 shadow-sm' : 'text-gray-500'}`;
      document.getElementById('tab-signup').className = `py-2 rounded-lg text-sm font-bold ${isSignup ? 'bg-white text-emerald-700 shadow-sm' : 'text-gray-500'}`;
      document.getElementById('auth-submit-btn').textContent = isSignup ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق';
    }

    function toggleMerchantFields() {
      const role = document.querySelector('input[name="role"]:checked').value;
      document.getElementById('merchant-only').classList.toggle('hidden', role !== 'merchant');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const phone = document.getElementById('auth-phone').value.trim().replace(/\s+/g, '');
      const password = document.getElementById('auth-password').value;
      const fakeEmail = `${phone}@tasairati.dz`;
      const btn = document.getElementById('auth-submit-btn');
      btn.disabled = true;
      btn.textContent = 'جاري المعالجة...';

      try {
        if (authMode === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
          if (error) throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة');
          currentUser = data.user;
          await loadUserProfile();
        } else {
          const fullName = document.getElementById('reg-name').value.trim();
          const role = document.querySelector('input[name="role"]:checked').value;
          const wilaya = document.getElementById('reg-wilaya').value;
          const municipality = document.getElementById('reg-municipality').value.trim();
          const shopName = document.getElementById('reg-shop').value.trim();
          const category = document.getElementById('reg-category').value;

          if (!fullName) throw new Error('يرجى كتابة الاسم الكامل');
          if (role === 'merchant' && !shopName) throw new Error('يرجى كتابة اسم المحل التجاري');

          const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
          if (error) throw new Error(error.message);
          if (!data.user) throw new Error('تأكد من إيقاف Confirm email في إعدادات Supabase');

          const { error: profErr } = await sb.from('profiles').insert({
            id: data.user.id,
            full_name: fullName,
            phone: phone,
            role: role,
            wilaya: wilaya,
            municipality: municipality,
            shop_name: role === 'merchant' ? shopName : null,
            category: role === 'merchant' ? category : null
          });
          if (profErr) throw new Error('خطأ في حفظ الملف: ' + profErr.message);

          currentUser = data.user;
          showToast('تم إنشاء حسابك بنجاح!');
          await loadUserProfile();
        }
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'signup' ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق';
      }
    }

    async function loadUserProfile() {
      const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (error || !data) {
        showAuthView();
        return;
      }
      currentProfile = data;
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      const isMerchant = currentProfile.role === 'merchant';
      document.getElementById('role-badge').textContent = isMerchant ? 'حساب تاجر' : 'حساب زبون';
      document.getElementById('header-subtitle').textContent = isMerchant
        ? `${currentProfile.shop_name} • ${currentProfile.wilaya}`
        : `مرحبًا ${currentProfile.full_name} • ${currentProfile.wilaya}`;

      setupNav();
      currentTab = 'home';
      await loadAllData();
    }

    function setupNav() {
      const isMerchant = currentProfile.role === 'merchant';
      const nav = document.getElementById('bottom-nav');
      if (isMerchant) {
        nav.innerHTML = `
          <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-emerald-600 font-bold text-xs">
            <span class="text-xl mb-0.5">📥</span><span>طلبات الزبائن</span>
          </button>
          <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 font-bold text-xs">
            <span class="text-xl mb-0.5">🏪</span><span>محلي وحسابي</span>
          </button>`;
      } else {
        nav.innerHTML = `
          <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-emerald-600 font-bold text-xs">
            <span class="text-xl mb-0.5">➕</span><span>طلب تسعيرة</span>
          </button>
          <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center text-gray-400 font-bold text-xs">
            <span class="text-xl mb-0.5">📋</span><span>طلباتي والعروض</span>
          </button>
          <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 font-bold text-xs">
            <span class="text-xl mb-0.5">👤</span><span>حسابي</span>
          </button>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      ['home', 'orders', 'profile'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) el.className = `flex flex-col items-center font-bold text-xs ${t === tab ? 'text-emerald-600' : 'text-gray-400'}`;
      });
      renderCurrentTab();
    }

    async function loadAllData() {
      if (currentProfile.role === 'customer') {
        const { data } = await sb
          .from('quote_requests')
          .select('*, quote_offers(*, profiles(shop_name, full_name, phone, municipality))')
          .eq('customer_id', currentProfile.id)
          .order('created_at', { ascending: false });
        myRequests = data || [];
      } else {
        let query = sb
          .from('quote_requests')
          .select('*, profiles(full_name, phone), quote_offers(*)')
          .eq('status', 'open')
          .order('created_at', { ascending: false });
        if (!showAllWilayas) {
          query = query.eq('wilaya', currentProfile.wilaya).eq('category', currentProfile.category);
        }
        const { data } = await query;
        openRequests = data || [];
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const main = document.getElementById('main-content');
      if (currentTab === 'profile') {
        main.innerHTML = renderProfileView();
        return;
      }
      if (currentProfile.role === 'customer') {
        main.innerHTML = currentTab === 'home' ? renderCustomerNewRequest() : renderCustomerOrders();
        populateWilayas();
        const reqWilaya = document.getElementById('req-wilaya');
        if (reqWilaya) reqWilaya.value = currentProfile.wilaya;
      } else {
        main.innerHTML = renderMerchantDashboard();
      }
    }

    function renderCustomerNewRequest() {
      const cat = CATEGORIES[selectedCategory];
      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="font-extrabold text-sm text-gray-800 mb-3">1. اختر مجال المشتريات</h2>
            <div class="grid grid-cols-2 gap-2.5">
              ${Object.entries(CATEGORIES).map(([key, c]) => `
                <button type="button" onclick="selectCat('${key}')" class="p-3 rounded-xl border-2 text-right transition ${selectedCategory === key ? 'border-emerald-600 bg-emerald-50/70' : 'border-gray-100 bg-gray-50'}">
                  <div class="text-2xl mb-1">${c.icon}</div>
                  <div class="text-xs font-extrabold text-gray-800">${c.short}</div>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
            <h2 class="font-extrabold text-sm text-gray-800">2. تفاصيل الطلب وقائمة المواد</h2>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">عنوان مختصر للطلب</label>
              <input id="req-title" type="text" placeholder="مثال: قضيان الشهر / قائمة مواد طلاء / قطع غيار بيجو 208" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-emerald-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">الولاية</label>
                <select id="req-wilaya" class="wilaya-select w-full px-3 py-2.5 rounded-xl border border-gray-200 text-sm bg-white outline-none"></select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">البلدية</label>
                <input id="req-municipality" type="text" value="${currentProfile.municipality || ''}" placeholder="البلدية" class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none">
              </div>
            </div>

            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200/70">
              <label class="block text-xs font-bold text-gray-700 mb-2">أضف المواد المطلوبة (أو اختر من الاقتراحات):</label>
              <div class="flex gap-1.5 overflow-x-auto hide-scroll pb-2 mb-2">
                ${cat.suggestions.map(s => `
                  <button type="button" onclick="quickAddItem('${s}')" class="shrink-0 text-[11px] bg-white border border-emerald-200 text-emerald-700 px-2.5 py-1 rounded-full font-bold">+ ${s}</button>
                `).join('')}
              </div>
              <div class="flex gap-2">
                <input id="item-name" type="text" placeholder="اسم المادة..." class="flex-1 px-3 py-2 rounded-lg border border-gray-200 bg-white text-xs outline-none">
                <input id="item-qty" type="text" placeholder="الكمية (1)" class="w-20 px-2.5 py-2 rounded-lg border border-gray-200 bg-white text-xs outline-none">
                <button type="button" onclick="addDraftItem()" class="bg-emerald-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold">إضافة</button>
              </div>
              <div id="draft-items-list" class="mt-2.5 space-y-1.5">
                ${draftItems.map((it, idx) => `
                  <div class="flex justify-between items-center bg-white px-3 py-1.5 rounded-lg border border-gray-100 text-xs">
                    <span class="font-bold">${it.name} <span class="text-emerald-600">(${it.qty})</span></span>
                    <button type="button" onclick="removeDraftItem(${idx})" class="text-red-500 font-bold px-1">✕</button>
                  </div>
                `).join('')}
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">📷 إرفاق صورة (ورقة المقاضي أو صورة القطعة - اختياري)</label>
              <input type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-gray-500 file:ml-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700">
              ${draftImageBase64 ? `<img src="${draftImageBase64}" class="mt-2 h-24 rounded-lg object-cover border">` : ''}
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">ملاحظات إضافية للتجار</label>
              <textarea id="req-notes" rows="2" placeholder="مثال: أحتاج التوصيل للمنزل، أو أريد نوعية أصلية..." class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-xs outline-none"></textarea>
            </div>

            <button type="button" onclick="submitQuoteRequest()" id="send-req-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3.5 rounded-xl shadow-md text-sm">
              🚀 إرسال طلب التسعيرة للتجار الآن
            </button>
          </div>
        </div>`;
    }

    function selectCat(cat) {
      selectedCategory = cat;
      renderCurrentTab();
    }

    function quickAddItem(name) {
      draftItems.push({ name, qty: '1' });
      renderCurrentTab();
    }

    function addDraftItem() {
      const name = document.getElementById('item-name').value.trim();
      const qty = document.getElementById('item-qty').value.trim() || '1';
      if (!name) return;
      draftItems.push({ name, qty });
      renderCurrentTab();
    }

    function removeDraftItem(idx) {
      draftItems.splice(idx, 1);
      renderCurrentTab();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 700;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          draftImageBase64 = canvas.toDataURL('image/jpeg', 0.65);
          renderCurrentTab();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitQuoteRequest() {
      const title = document.getElementById('req-title').value.trim();
      const wilaya = document.getElementById('req-wilaya').value;
      const municipality = document.getElementById('req-municipality').value.trim();
      const notes = document.getElementById('req-notes').value.trim();

      if (!title) return showToast('يرجى كتابة عنوان للطلب', true);
      if (draftItems.length === 0 && !draftImageBase64 && !notes) {
        return showToast('أضف مادة واحدة على الأقل أو أرفق صورة القائمة', true);
      }

      const btn = document.getElementById('send-req-btn');
      btn.disabled = true;
      btn.textContent = 'جاري إرسال الطلب...';

      const { error } = await sb.from('quote_requests').insert({
        customer_id: currentProfile.id,
        category: selectedCategory,
        wilaya,
        municipality,
        title,
        items: draftItems,
        notes,
        image_url: draftImageBase64,
        status: 'open'
      });

      if (error) {
        showToast('حدث خطأ: ' + error.message, true);
        btn.disabled = false;
        btn.textContent = '🚀 إرسال طلب التسعيرة للتجار الآن';
      } else {
        draftItems = [];
        draftImageBase64 = null;
        showToast('تم إرسال طلبك للتجار بنجاح!');
        await loadAllData();
        switchTab('orders');
      }
    }

    function renderCustomerOrders() {
      if (myRequests.length === 0) {
        return `<div class="text-center py-12 bg-white rounded-2xl border border-gray-100 p-6">
          <div class="text-4xl mb-2">📭</div>
          <p class="font-bold text-gray-700">لم ترسل أي طلب تسعيرة بعد</p>
          <button onclick="switchTab('home')" class="mt-3 bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl">اطلب تسعيرتك الأولى</button>
        </div>`;
      }

      return `<div class="space-y-4">
        ${myRequests.map(req => {
          const cat = CATEGORIES[req.category] || CATEGORIES.supermarket;
          const offers = (req.quote_offers || []).sort((a, b) => Number(a.total_price) - Number(b.total_price));
          return `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <span class="text-[11px] bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded-md">${cat.icon} ${cat.short}</span>
                  <h3 class="font-extrabold text-sm text-gray-900 mt-1">${req.title}</h3>
                  <p class="text-[11px] text-gray-400">${req.wilaya} ${req.municipality ? '- ' + req.municipality : ''}</p>
                </div>
                <span class="text-xs font-extrabold px-2.5 py-1 rounded-full ${offers.length > 0 ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-500'}">
                  ${offers.length} عروض
                </span>
              </div>

              ${req.items && req.items.length > 0 ? `
                <div class="flex flex-wrap gap-1 my-2">
                  ${req.items.map(i => `<span class="text-[11px] bg-gray-100 px-2 py-0.5 rounded text-gray-700">${i.name} (${i.qty})</span>`).join('')}
                </div>` : ''}

              ${req.image_url ? `<img src="${req.image_url}" class="w-full max-h-40 object-cover rounded-xl my-2 border">` : ''}

              <div class="mt-3 pt-3 border-t border-gray-100 space-y-2.5">
                ${offers.length === 0 ? `<p class="text-xs text-gray-400 text-center py-2">⏳ في انتظار رد التجار في ولايتك...</p>` :
                  offers.map((of, idx) => `
                    <div class="p-3 rounded-xl border ${idx === 0 ? 'border-emerald-500 bg-emerald-50/40' : 'border-gray-200 bg-gray-50/50'}">
                      <div class="flex justify-between items-center">
                        <div>
                          ${idx === 0 ? `<span class="text-[10px] bg-emerald-600 text-white font-bold px-2 py-0.5 rounded-full">★ أفضل سعر</span>` : ''}
                          <div class="font-extrabold text-sm text-gray-900 mt-0.5">${of.profiles?.shop_name || 'محل تجاري'}</div>
                          <div class="text-[11px] text-gray-500">${of.profiles?.municipality || ''} • ${of.delivery_available ? '🚚 التوصيل متوفر' : '🏪 استلام من المحل'}</div>
                        </div>
                        <div class="text-left">
                          <div class="text-base font-extrabold text-emerald-700">${Number(of.total_price).toLocaleString()} دج</div>
                        </div>
                      </div>
                      ${of.notes ? `<p class="text-xs text-gray-600 mt-1.5 bg-white p-2 rounded-lg border border-gray-100">💬 ${of.notes}</p>` : ''}
                      <div class="grid grid-cols-2 gap-2 mt-2.5">
                        <a href="tel:${of.profiles?.phone || ''}" class="bg-emerald-600 text-white text-center py-2 rounded-lg text-xs font-bold">📞 اتصال (${of.profiles?.phone || ''})</a>
                        <button onclick="selectOffer('${req.id}', '${of.id}')" class="${of.status === 'selected' ? 'bg-gray-800 text-white' : 'bg-white border border-emerald-600 text-emerald-700'} py-2 rounded-lg text-xs font-bold">
                          ${of.status === 'selected' ? '✅ تم اختيار العرض' : 'اعتماد العرض'}
                        </button>
                      </div>
                    </div>
                  `).join('')
                }
              </div>
            </div>`;
        }).join('')}
      </div>`;
    }

    async function selectOffer(reqId, offerId) {
      await sb.from('quote_offers').update({ status: 'selected' }).eq('id', offerId);
      await sb.from('quote_requests').update({ status: 'accepted' }).eq('id', reqId);
      showToast('تم اعتماد العرض! يمكنك الاتصال بالتاجر الآن');
      await loadAllData();
    }

    function renderMerchantDashboard() {
      return `<div class="space-y-4">
        <div class="bg-white p-3 rounded-2xl border border-gray-100 flex justify-between items-center">
          <span class="text-xs font-bold text-gray-700">نطاق عرض الطلبات:</span>
          <button onclick="toggleWilayaScope()" class="text-xs font-bold px-3 py-1.5 rounded-xl ${showAllWilayas ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}">
            ${showAllWilayas ? '🌍 كل الولايات والتخصصات' : `📍 ${currentProfile.wilaya} فقط`}
          </button>
        </div>

        ${openRequests.length === 0 ? `
          <div class="text-center py-12 bg-white rounded-2xl border border-gray-100 p-6">
            <div class="text-4xl mb-2">🔎</div>
            <p class="font-bold text-gray-700 text-sm">لا توجد طلبات مفتوحة حاليًا في نطاقك</p>
            <p class="text-xs text-gray-400 mt-1">اضغط على الزر بالأعلى لعرض طلبات كل الولايات للتجربة</p>
          </div>` :
          openRequests.map(req => {
            const cat = CATEGORIES[req.category] || CATEGORIES.supermarket;
            const myOffer = (req.quote_offers || []).find(o => o.merchant_id === currentProfile.id);
            return `
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-2.5">
                <div class="flex justify-between items-start">
                  <div>
                    <span class="text-[11px] bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded-md">${cat.icon} ${cat.short} • ${req.wilaya}</span>
                    <h3 class="font-extrabold text-sm text-gray-900 mt-1">${req.title}</h3>
                    <p class="text-[11px] text-gray-500">الزبون: ${req.profiles?.full_name || 'زبون'} (${req.municipality || ''})</p>
                  </div>
                </div>

                ${req.items && req.items.length > 0 ? `
                  <div class="bg-gray-50 p-2.5 rounded-xl space-y-1">
                    <div class="text-[11px] font-bold text-gray-500">القائمة المطلوبة:</div>
                    ${req.items.map(i => `<div class="text-xs font-bold text-gray-800">• ${i.name} — <span class="text-emerald-700">الكمية: ${i.qty}</span></div>`).join('')}
                  </div>` : ''}

                ${req.image_url ? `<img src="${req.image_url}" class="w-full max-h-48 object-contain bg-gray-50 rounded-xl border">` : ''}
                ${req.notes ? `<p class="text-xs text-amber-800 bg-amber-50 p-2 rounded-lg">📝 ملاحظة الزبون: ${req.notes}</p>` : ''}

                ${myOffer ? `
                  <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-xs font-bold text-emerald-800">
                    ✅ أرسلت عرضك بقيمة: ${Number(myOffer.total_price).toLocaleString()} دج
                  </div>` : `
                  <div class="pt-2 border-t border-gray-100 space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                      <input type="number" id="price-${req.id}" placeholder="السعر الإجمالي (دج)" class="px-3 py-2 rounded-xl border border-gray-200 text-xs font-bold outline-none focus:border-emerald-500">
                      <select id="deliv-${req.id}" class="px-2.5 py-2 rounded-xl border border-gray-200 text-xs bg-white outline-none">
                        <option value="false">🏪 استلام من المحل</option>
                        <option value="true">🚚 التوصيل متوفر</option>
                      </select>
                    </div>
                    <input type="text" id="note-${req.id}" placeholder="ملاحظة للزبون (مثال: كل المواد متوفرة وجاهزة)" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs outline-none">
                    <button onclick="sendMerchantOffer('${req.id}')" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm">
                      إرسال التسعيرة للزبون
                    </button>
                  </div>`
                }
              </div>`;
          }).join('')
        }
      </div>`;
    }

    function toggleWilayaScope() {
      showAllWilayas = !showAllWilayas;
      loadAllData();
    }

    async function sendMerchantOffer(reqId) {
      const price = document.getElementById(`price-${reqId}`).value;
      const delivery = document.getElementById(`deliv-${reqId}`).value === 'true';
      const notes = document.getElementById(`note-${reqId}`).value.trim();

      if (!price || Number(price) <= 0) return showToast('أدخل السعر الإجمالي بالدينار الجزائري', true);

      const { error } = await sb.from('quote_offers').insert({
        request_id: reqId,
        merchant_id: currentProfile.id,
        total_price: Number(price),
        delivery_available: delivery,
        notes: notes
      });

      if (error) {
        showToast('خطأ في إرسال العرض: ' + error.message, true);
      } else {
        showToast('تم إرسال تسعيرتك للزبون بنجاح!');
        await loadAllData();
      }
    }

    function renderProfileView() {
      return `
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
          <div class="text-center pb-4 border-b border-gray-100">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full mx-auto flex items-center justify-center text-2xl font-extrabold mb-2">
              ${currentProfile.role === 'merchant' ? '🏪' : '👤'}
            </div>
            <h2 class="font-extrabold text-base text-gray-900">${currentProfile.shop_name || currentProfile.full_name}</h2>
            <p class="text-xs text-gray-500 mt-0.5">${currentProfile.wilaya} • ${currentProfile.phone}</p>
          </div>
          <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-bold py-3 rounded-xl text-sm">
            تسجيل الخروج
          </button>
        </div>`;
    }

    async function handleLogout() {
      await sb.auth.signOut();
      currentUser = null;
      currentProfile = null;
      showAuthView();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
