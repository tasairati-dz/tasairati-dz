  <script>
    const WILAYAS = [
      "01 - أدرار", "02 - الشلف", "03 - الأغواط", "04 - أم البواقي", "05 - باتنة", "06 - بجاية",
      "07 - بسكرة", "08 - بشار", "09 - البليدة", "10 - البويرة", "11 - تمنراست", "12 - تبسة",
      "13 - تلمسان", "14 - تيارت", "15 - تيزي وزو", "16 - الجزائر", "17 - الجلفة", "18 - جيجل",
      "19 - سطيف", "20 - سعيدة", "21 - سكيكدة", "22 - سيدي بلعباس", "23 - عنابة", "24 - قالمة",
      "25 - قسنطينة", "26 - المدية", "27 - مستغانم", "28 - المسيلة", "29 - معسكر", "30 - ورقلة",
      "31 - وهران", "32 - البيض", "33 - إليزي", "34 - برج بوعريريج", "35 - بومرداس", "36 - الطارف",
      "37 - تندوف", "38 - تيسمسيلت", "39 - الوادي", "40 - خنشلة", "41 - سوق أهراس", "42 - تيبازة",
      "43 - ميلة", "44 - عين الدفلى", "45 - النعامة", "46 - عين تموشنت", "47 - غرداية", "48 - غليزان",
      "49 - تيميمون", "50 - برج باجي مختار", "51 - أولاد جلال", "52 - بني عباس", "53 - عين صالح",
      "54 - عين قزام", "55 - تقرت", "56 - جانت", "57 - المغير", "58 - المنيعة"
    ];

    const CATEGORIES = {
      supermarket: { name: 'المواد الغذائية والتنظيف', short: 'سوبرماركت', icon: '🛒', suggestions: ['زيت المائدة 5ل', 'سكر 5كغ', 'قهوة 250غ', 'سائل غسيل الملابس', 'حفاضات أطفال'] },
      building: { name: 'مواد البناء والترميم', short: 'مواد البناء', icon: '🧱', suggestions: ['إسمنت 50كغ', 'حديد تسليح 12مم', 'رمل بناء', 'حصى', 'طلاء مائي'] },
      auto: { name: 'قطع غيار السيارات', short: 'قطع الغيار', icon: '🚗', suggestions: ['صفائح الفرامل', 'فلتر زيت', 'طقم التوزيع', 'بطارية 60Ah'] },
      appliances: { name: 'الأجهزة الكهرومنزلية', short: 'كهرومنزلية', icon: '🔌', suggestions: ['مكيف هواء', 'ثلاجة', 'غسالة ملابس', 'تلفاز ذكي'] }
    };

    let sb = null;
    let currentUser = null;
    let currentProfile = null;
    let authMode = 'login';
    let currentTab = 'home';
    let selectedCategory = 'supermarket';
    let draftItems = [];
    let myRequests = [];
    let openRequests = [];
    let flashDeals = [];
    let showAllWilayas = false;
    let isDarkMode = localStorage.getItem('dark_mode') === 'true';

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      localStorage.setItem('dark_mode', isDarkMode);
      applyTheme();
    }

    function applyTheme() {
      const body = document.getElementById('app-body');
      const nav = document.getElementById('bottom-nav');
      if (isDarkMode) {
        body.classList.remove('bg-gray-50', 'text-gray-800');
        body.classList.add('bg-gray-900', 'text-gray-100');
        if (nav) { nav.classList.remove('bg-white'); nav.classList.add('bg-gray-800', 'border-gray-700'); }
      } else {
        body.classList.remove('bg-gray-900', 'text-gray-100');
        body.classList.add('bg-gray-50', 'text-gray-800');
        if (nav) { nav.classList.remove('bg-gray-800', 'border-gray-700'); nav.classList.add('bg-white'); }
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return null;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)))).toFixed(1);
    }

    function formatDzWhatsApp(phone) {
      if (!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '213' + clean.substring(1);
      else if (!clean.startsWith('213')) clean = '213' + clean;
      return clean;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function populateWilayas() {
      document.querySelectorAll('.wilaya-select').forEach(sel => {
        const curVal = sel.value;
        sel.innerHTML = WILAYAS.map(w => `<option value="${w}">${w}</option>`).join('');
        if (curVal) sel.value = curVal;
      });
    }

    async function requestNotificationPermission() {
      if (!("Notification" in window)) return showToast('متصفحك لا يدعم الإشعارات', true);
      const perm = await Notification.requestPermission();
      if (perm === "granted") showToast('✅ تم تفعيل الإشعارات بنجاح!');
    }

    function requestUserGPSLocation() {
      if (!navigator.geolocation) return showToast('متصفحك لا يدعم تحديد الموقع', true);
      showToast('📍 جاري تحديد موقعك الفعلي...');
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        if (currentProfile) {
          await sb.from('profiles').update({ latitude: lat, longitude: lon }).eq('id', currentProfile.id);
          currentProfile.latitude = lat; currentProfile.longitude = lon;
        }
        showToast('✅ تم تثبيت موقعك بنجاح!');
      }, () => { showToast('يرجى السماح بالوصول للموقع', true); }, { timeout: 10000 });
    }

    async function viewUserProfile(userId) {
      const { data: userData } = await sb.from('profiles').select('*').eq('id', userId).single();
      if (!userData) return showToast('تعذر تحميل الملف الشخصي', true);

      const { data: reviewsData } = await sb.from('merchant_reviews').select('*, profiles:customer_id(full_name)').eq('merchant_id', userId);
      const reviews = reviewsData || [];
      let avgRating = 5;
      if (reviews.length > 0) avgRating = (reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length).toFixed(1);

      let distanceText = '';
      if (currentProfile && currentProfile.latitude && currentProfile.longitude && userData.latitude && userData.longitude) {
        const dist = calculateDistance(currentProfile.latitude, currentProfile.longitude, userData.latitude, userData.longitude);
        if (dist) distanceText = `<div class="text-xs text-emerald-600 font-bold mt-1">📍 يبعد عنك مسافة تقريبية: ${dist} كم</div>`;
      }

      const waPhone = formatDzWhatsApp(userData.phone || '');
      document.getElementById('modal-profile-body').innerHTML = `
        <h3 class="font-extrabold text-base">${userData.shop_name || userData.full_name}</h3>
        <div class="text-amber-500 font-extrabold my-1">★ ${avgRating} (${reviews.length} تقييمات)</div>
        ${distanceText}
        <div class="grid grid-cols-2 gap-2 mt-3">
          <a href="tel:${userData.phone || ''}" class="bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold text-center">📞 اتصال</a>
          <a href="https://wa.me/${waPhone}" target="_blank" class="bg-[#25D366] text-white py-2 rounded-xl text-xs font-bold text-center">💬 واتساب</a>
        </div>
      `;
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

    async function initApp() {
      try {
        populateWilayas();
        applyTheme();
        if (typeof window.supabase === 'undefined') throw new Error('تعذر تحميل مكتبة الاتصال');
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data: { session } } = await sb.auth.getSession();
        if (session) { currentUser = session.user; await loadUserProfile(); }
        else { showAuthView(); }
      } catch (err) { showAuthView(); }
    }

    function showAuthView() {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-view').classList.add('hidden');
      document.getElementById('auth-view').classList.remove('hidden');
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      const isForgot = mode === 'forgot';
      document.getElementById('signup-fields').classList.toggle('hidden', !isSignup);
      document.getElementById('auth-tabs').classList.toggle('hidden', isForgot);
      document.getElementById('password-field-container').classList.toggle('hidden', isForgot);
      
      const submitBtn = document.getElementById('auth-submit-btn');
      const forgotBtn = document.getElementById('forgot-toggle-btn');
      if (isForgot) {
        submitBtn.textContent = 'تحقق من رقم الهاتف';
        forgotBtn.textContent = 'العودة لتسجيل الدخول';
        forgotBtn.setAttribute('onclick', "switchAuthMode('login')");
      } else {
        submitBtn.textContent = isSignup ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق';
        forgotBtn.textContent = 'نسيت كلمة المرور؟';
        forgotBtn.setAttribute('onclick', "switchAuthMode('forgot')");
      }
    }

    function toggleMerchantFields() {
      const role = document.querySelector('input[name="role"]:checked').value;
      document.getElementById('merchant-only').classList.toggle('hidden', role !== 'merchant');
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          draftAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('avatar-preview-container').innerHTML = `<img src="${draftAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleEditAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          editAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          const previewEl = document.getElementById('edit-avatar-preview');
          if (previewEl) previewEl.innerHTML = `<img src="${editAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const phoneInput = document.getElementById('auth-phone');
      const phone = phoneInput ? phoneInput.value.trim().replace(/\s+/g, '') : '';
      const btn = document.getElementById('auth-submit-btn');

      if (authMode === 'forgot') {
        if (!phone) { showToast('يرجى إدخال رقم الهاتف', true); return; }
        btn.disabled = true; btn.textContent = 'جاري البحث عن الحساب...';
        try {
          const { data, error } = await sb.from('profiles').select('full_name, shop_name, phone').eq('phone', phone).maybeSingle();
          if (error) throw new Error('حدث خطأ في الاتصال بقاعدة البيانات');
          if (!data) {
            alert(`❌ رقم الهاتف (${phone}) غير مسجل في التطبيق.`);
          } else {
            const ownerName = data.shop_name || data.full_name;
            alert(`✅ تم العثور على حسابك بنجاح!\n\nصاحب الحساب: ${ownerName}\nرقم الهاتف: ${phone}\n\nيرجى تسجيل الدخول بكلمة المرور الخاصة بك.`);
            switchAuthMode('login');
          }
        } catch (err) { showToast(err.message || 'خطأ في التحقق', true); }
        finally { btn.disabled = false; btn.textContent = 'تحقق من رقم الهاتف'; }
        return;
      }

      const password = document.getElementById('auth-password').value;
      const fakeEmail = `${phone}@tasairati.dz`;
      btn.disabled = true; btn.textContent = 'جاري المعالجة...';

      try {
        if (authMode === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
          if (error) throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة');
          currentUser = data.user; await loadUserProfile();
        } else {
          const fullName = document.getElementById('reg-name').value.trim();
          const role = document.querySelector('input[name="role"]:checked').value;
          const wilaya = document.getElementById('reg-wilaya').value;
          const municipality = document.getElementById('reg-municipality').value.trim();
          const shopName = document.getElementById('reg-shop').value.trim();
          const category = document.getElementById('reg-category').value;

          if (!fullName) throw new Error('أدخل الاسم الكامل');
          if (role === 'merchant' && !shopName) throw new Error('أدخل اسم المحل');

          const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
          if (error) throw new Error(error.message);

          await sb.from('profiles').insert({
            id: data.user.id, full_name: fullName, phone, role, wilaya, municipality,
            shop_name: role === 'merchant' ? shopName : null,
            category: role === 'merchant' ? category : null,
            avatar_url: draftAvatarBase64
          });
          currentUser = data.user; showToast('تم إنشاء الحساب بنجاح!');
          await loadUserProfile();
        }
      } catch (err) { showToast(err.message, true); }
      finally { btn.disabled = false; btn.textContent = authMode === 'signup' ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق'; }
    }

    async function loadUserProfile() {
      const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (!data) { showAuthView(); return; }
      currentProfile = data;
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      const isMerchant = currentProfile.role === 'merchant';
      document.getElementById('role-badge').textContent = isMerchant ? 'حساب تاجر' : 'حساب زبون';
      document.getElementById('header-subtitle').textContent = isMerchant ? `${currentProfile.shop_name} • ${currentProfile.wilaya}` : `مرحبًا ${currentProfile.full_name}`;

      setupNav(); currentTab = 'home'; await loadAllData();
    }

          <button onclick="switchTab('deals')" id="nav-deals" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">⚡</span><span>عروضي</span></button>
          <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">📜</span><span>السجل</span></button>
          <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">🏪</span><span>حسابي</span></button>`;

          <button onclick="switchTab('deals')" id="nav-deals" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">⚡</span><span>العروض</span></button>
          <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">📋</span><span>طلباتي</span></button>
          <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">👤</span><span>حسابي</span></button>`;

    function switchTab(tab) {
      currentTab = tab;
      const tabsList = currentProfile.role === 'merchant' ? ['home', 'deals', 'history', 'profile'] : ['home', 'deals', 'orders', 'history', 'profile'];
      tabsList.forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) el.className = `flex flex-col items-center font-bold text-xs ${t === tab ? 'text-emerald-600' : 'text-gray-400'}`;
      });
      renderCurrentTab();
    }

    async function loadAllData() {
      try {
        const { data: dealsData } = await sb.from('flash_deals').select('*, profiles(shop_name, phone, avatar_url, wilaya, municipality, latitude, longitude)').eq('wilaya', currentProfile.wilaya).order('created_at', { ascending: false });
        flashDeals = dealsData || [];

        if (currentProfile.role === 'customer') {
          const { data } = await sb.from('quote_requests').select('*, quote_offers(*, profiles(shop_name, full_name, phone, municipality, avatar_url, category, latitude, longitude))').eq('customer_id', currentProfile.id).order('created_at', { ascending: false });
          myRequests = data || [];
        } else {
          let query = sb.from('quote_requests').select('*, profiles(id, full_name, phone, avatar_url, wilaya, municipality, latitude, longitude), quote_offers(*)').order('created_at', { ascending: false });
          if (!showAllWilayas) query = query.eq('wilaya', currentProfile.wilaya).eq('category', currentProfile.category);
          const { data } = await query;
          openRequests = (data || []).filter(r => r.status === 'open');
        }
      } catch (err) { console.error(err); }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const main = document.getElementById('main-content');
      if (currentTab === 'profile') {
        main.innerHTML = renderProfileView();
        populateWilayas();
        const editWilaya = document.getElementById('edit-wilaya');
        if (editWilaya) editWilaya.value = currentProfile.wilaya;
        return;
      }
      if (currentTab === 'history') { main.innerHTML = renderHistoryView(); return; }
      if (currentTab === 'deals') { main.innerHTML = renderFlashDealsView(); return; }
      if (currentProfile.role === 'customer') {
        main.innerHTML = currentTab === 'home' ? renderCustomerNewRequest() : renderCustomerOrders();
        populateWilayas();
        const reqWilaya = document.getElementById('req-wilaya');
        if (reqWilaya) reqWilaya.value = currentProfile.wilaya;
      } else {
        main.innerHTML = renderMerchantDashboard();
      }

      draftItems.splice(index, 1);
      renderDraftItemsList();

      draftItems = [];

    async function submitQuoteRequest() {
      const title = document.getElementById('req-title').value.trim();
      const wilaya = document.getElementById('req-wilaya').value;
      if (!title) return showToast('أدخل عنوان الطلب العام', true);
      if (draftItems.length === 0) return showToast('أضف مادة واحدة على الأقل للطلب', true);

      const { error } = await sb.from('quote_requests').insert({
        customer_id: currentProfile.id,
        category: selectedCategory,
        wilaya,
        title,
        items: draftItems,
        status: 'open'
      });

      if (error) showToast('خطأ: ' + error.message, true);
      else {
        showToast('تم إرسال الطلب بنجاح!');
        draftItems = [];
        switchTab('orders');
      }
    }

    function renderMerchantDashboard() {
      return `<div class="space-y-4">
        <div class="${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'} p-3 rounded-2xl border flex justify-between items-center">
          <span class="text-xs font-bold">نطاق عرض الطلبات:</span>
          <button onclick="toggleWilayaScope()" class="text-xs font-bold px-3 py-1.5 rounded-xl ${showAllWilayas ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}">
            ${showAllWilayas ? '🌍 كل الولايات' : `📍 ${currentProfile.wilaya} فقط`}

        </div>

          <div class="text-center py-12 ${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'} rounded-2xl border p-6">

          </div>` :
          openRequests.map(req => {
            const hasItems = req.items && req.items.length > 0;
            return `
              <div class="${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'} rounded-2xl p-4 shadow-sm border space-y-2.5">
                <h3 class="font-extrabold text-sm">${req.title}</h3>
                ${hasItems ? `
                  <div class="bg-gray-50 dark:bg-gray-700 p-2.5 rounded-xl space-y-2">

                    ${req.items.map((it, idx) => `
                      <div class="flex items-center justify-between gap-2 bg-white dark:bg-gray-800 px-2.5 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600">
                        <span class="text-xs font-bold flex-1">${it.name} (${it.qty})</span>
                        <input type="number" oninput="recalcTotal('${req.id}', ${req.items.length})" id="item-price-${req.id}-${idx}" placeholder="السعر دج" class="w-24 px-2 py-1 rounded border text-xs font-bold text-left outline-none ${isDarkMode ? 'bg-gray-700 text-white' : ''}">
                      </div>
                    `).join('')}
                  </div>` : ''}
                <input type="number" id="price-${req.id}" placeholder="السعر الإجمالي (دج)" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-emerald-300 text-xs font-extrabold outline-none ${isDarkMode ? 'bg-gray-700 text-white' : ''}">
                <button onclick="sendMerchantOffer('${req.id}')" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs">إرسال التسعيرة للزبون</button>
              </div>`;
          }).join('')}
      </div>`;

    function recalcTotal(reqId, count) {
      let sum = 0;
      for (let i = 0; i < count; i++) {
        const val = Number(document.getElementById(`item-price-${reqId}-${i}`)?.value || 0);
        if (val > 0) sum += val;
      }
      if (sum > 0) document.getElementById(`price-${reqId}`).value = sum;
    }

    function toggleWilayaScope() { showAllWilayas = !showAllWilayas; loadAllData(); }

    async function sendMerchantOffer(reqId) {
      const price = document.getElementById(`price-${reqId}`).value;
      if (!price || Number(price) <= 0) return showToast('أدخل السعر الإجمالي', true);

      const { error } = await sb.from('quote_offers').insert({
        request_id: reqId,
        merchant_id: currentProfile.id,
        total_price: Number(price)
      });

      if (error) showToast('خطأ: ' + error.message, true);
      else { showToast('تم إرسال تسعيرتك بنجاح!'); loadAllData(); }
    }

    function renderProfileView() {
      const isMerchant = currentProfile.role === 'merchant';
      const avatarDisplay = editAvatarBase64 || currentProfile.avatar_url;
      const avatarHtml = avatarDisplay
        ? `<img src="${avatarDisplay}" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-emerald-500 shadow-sm mb-2">`
        : `<div class="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full mx-auto flex items-center justify-center text-3xl font-extrabold mb-2">${isMerchant ? '🏪' : '👤'}</div>`;

      return `
        <div class="${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-100'} rounded-2xl p-5 shadow-sm border space-y-4">
          <div class="text-center pb-3 border-b border-gray-100 dark:border-gray-700">
            <div class="relative inline-block">
              <div id="edit-avatar-preview" class="w-20 h-20 rounded-full overflow-hidden mx-auto">${avatarHtml}</div>
              <label class="absolute bottom-1 left-1 bg-emerald-600 text-white p-1.5 rounded-full cursor-pointer shadow text-xs">
                📷 <input type="file" accept="image/*" onchange="handleEditAvatarUpload(event)" class="hidden">
              </label>
            </div>
            <h2 class="font-extrabold text-base mt-1">${currentProfile.shop_name || currentProfile.full_name}</h2>
            <p class="text-xs text-gray-400">تعديل بيانات الحساب الشخصي</p>
          </div>

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1">الاسم الكامل</label>
              <input type="text" id="edit-name" value="${currentProfile.full_name || ''}" class="w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : ''}">
            </div>
            ${isMerchant ? `
              <div>
                <label class="block text-xs font-bold mb-1">اسم المحل التجاري</label>
                <input type="text" id="edit-shop" value="${currentProfile.shop_name || ''}" class="w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : ''}">
              </div>
            ` : ''}
            <div>
              <label class="block text-xs font-bold mb-1">رقم الهاتف</label>
              <input type="tel" id="edit-phone" value="${currentProfile.phone || ''}" dir="ltr" class="w-full px-3 py-2.5 rounded-xl border text-xs text-right outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : ''}">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-bold mb-1">الولاية</label>
                <select id="edit-wilaya" class="wilaya-select w-full px-3 py-2.5 rounded-xl border text-xs bg-white text-black outline-none"></select>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">البلدية</label>
                <input type="text" id="edit-municipality" value="${currentProfile.municipality || ''}" class="w-full px-3 py-2.5 rounded-xl border text-xs outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : ''}">
              </div>
            </div>
            <button onclick="saveProfileChanges()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-sm">
              حفظ التعديلات
            </button>
          </div>

          <div class="bg-emerald-50 dark:bg-emerald-900/30 p-3 rounded-xl text-center">
            <div class="text-xs text-emerald-700 dark:text-emerald-300 font-bold">📊 إحصائيات ونقاط التاجر</div>
            <div class="text-base font-extrabold text-emerald-600 mt-1">⭐ ممتاز وموثوق</div>
          </div>

          <div class="pt-3 border-t border-gray-100 dark:border-gray-700">
            <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-bold py-2.5 rounded-xl text-xs">تسجيل الخروج</button>
          </div>
        </div>`;
    }

    async function saveProfileChanges() {
      const fullName = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();
      const wilaya = document.getElementById('edit-wilaya').value;
      const municipality = document.getElementById('edit-municipality').value.trim();
      const shopName = document.getElementById('edit-shop') ? document.getElementById('edit-shop').value.trim() : null;

      if (!fullName) return showToast('أدخل الاسم الكامل', true);

      const updateData = { full_name: fullName, phone, wilaya, municipality };
      if (shopName !== null) updateData.shop_name = shopName;
      if (editAvatarBase64) updateData.avatar_url = editAvatarBase64;

      const { error } = await sb.from('profiles').update(updateData).eq('id', currentProfile.id);
      if (error) showToast('خطأ في الحفظ: ' + error.message, true);
      else { showToast('تم تحديث الملف بنجاح!'); editAvatarBase64 = null; await loadUserProfile(); }
    }

    async function handleLogout() {
      await sb.auth.signOut();
      currentUser = null; currentProfile = null; showAuthView();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
