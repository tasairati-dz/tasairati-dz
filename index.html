  <script>
    const WILAYAS = [
      "01 - أدرار", "02 - الشلف", "03 - الأغواط", "04 - أم البواقي", "05 - باتنة", "06 - بجاية",

      "25 - قسنطينة", "26 - المدية", "27 - مستغانم", "28 - المسيلة", "29 - معسكر", "30 - ورقلة",
      "31 - وهران", "32 - البيض", "33 - إليزي", "34 - برج بوعريريج", "35 - بومرداس", "36 - الطارف",
      "37 - تندوف", "38 - تيسمسيلت", "39 - الوادي", "40 - خنشلة", "41 - سوق أهراس", "42 - تيبازة",
      "43 - ميلة", "44 - عين الدفلى", "45 - النعامة", "46 - عين تموشنت", "47 - غرداية", "48 - غليزان",
      "49 - تيميمون", "50 - برج باجي مختار", "51 - أولاد جلال", "52 - بني عباس", "53 - عين صالح",
      "54 - عين قزام", "55 - تقرت", "56 - جانت", "57 - المغير", "58 - المنيعة"
    ];

    const CATEGORIES = {
      supermarket: { name: 'المواد الغذائية والتنظيف', short: 'سوبرماركت', icon: '🛒', suggestions: ['زيت المائدة 5ل', 'سكر 5كغ', 'قهوة 250غ', 'سائل غسيل الملابس', 'حفاضات أطفال'] },
      building: { name: 'مواد البناء والترميم', short: 'مواد البناء', icon: '🧱', suggestions: ['إسمنت 50كغ', 'حديد تسليح 12مم', 'رمل بناء', 'حصى', 'طلاء مائي'] },
      auto: { name: 'قطع غيار السيارات', short: 'قطع الغيار', icon: '🚗', suggestions: ['صفائح الفرامل', 'فلتر زيت', 'طقم التوزيع', 'بطارية 60Ah'] },
      appliances: { name: 'الأجهزة الكهرومنزلية', short: 'كهرومنزلية', icon: '🔌', suggestions: ['مكيف هواء', 'ثلاجة', 'غسالة ملابس', 'تلفاز ذكي'] }
    };

    let sb = null;
    let currentUser = null;
    let currentProfile = null;
    let authMode = 'login'; // 'login', 'signup', 'forgot'
    let currentTab = 'home';
    let selectedCategory = 'supermarket';
    let draftItems = [];
    let draftImageBase64 = null;
    let draftAvatarBase64 = null;
    let editAvatarBase64 = null;
    let myRequests = [];
    let openRequests = [];
    let flashDeals = [];
    let historyRequests = [];
    let showAllWilayas = false;

    function formatDzWhatsApp(phone) {
      if (!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '213' + clean.substring(1);
      else if (!clean.startsWith('213')) clean = '213' + clean;
      return clean;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function populateWilayas() {
      document.querySelectorAll('.wilaya-select').forEach(sel => {
        const curVal = sel.value;
        sel.innerHTML = WILAYAS.map(w => `<option value="${w}">${w}</option>`).join('');
        if (curVal) sel.value = curVal;
      });
    }

    async function requestNotificationPermission() {
      if (!("Notification" in window)) return showToast('متصفحك لا يدعم الإشعارات الفورية', true);
      const permission = await Notification.requestPermission();
      if (permission === "granted") showToast('✅ تم تفعيل الإشعارات الفورية بنجاح!');
      else showToast('يرجى السماح بالإشعارات من إعدادات المتصفح', true);
    }

    function triggerBackgroundNotification(title, body) {
      if (Notification.permission === "granted") {
        try { new Notification(title, { body }); } catch (e) {}
      }
    }

    function requestUserGPSLocation() {
      if (!navigator.geolocation) return showToast('متصفحك لا يدعم تحديد الموقع', true);
      showToast('📍 جاري تحديد موقعك الفعلي المباشر...');
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        if (currentProfile) {
          await sb.from('profiles').update({ latitude: lat, longitude: lon }).eq('id', currentProfile.id);
          currentProfile.latitude = lat;
          currentProfile.longitude = lon;
        }
        showToast('✅ تم تثبيت موقعك المباشر بنجاح!');
      }, (error) => {
        showToast('يرجى السماح بالوصول للموقع من المتصفح', true);
      }, { timeout: 10000 });
    }

    async function viewUserProfile(userId) {
      const { data: userData, error } = await sb.from('profiles').select('*').eq('id', userId).single();
      if (error || !userData) return showToast('تعذر تحميل الملف الشخصي', true);

      const { data: reviewsData } = await sb.from('merchant_reviews').select('*, profiles:customer_id(full_name)').eq('merchant_id', userId).order('created_at', { ascending: false });
      const reviews = reviewsData || [];
      let avgRating = 5;
      if (reviews.length > 0) {
        const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
        avgRating = (sum / reviews.length).toFixed(1);
      }

      const isMer = userData.role === 'merchant';
      const avatarH = userData.avatar_url 
        ? `<img src="${userData.avatar_url}" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-emerald-500 shadow-sm mb-2">`
        : `<div class="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full mx-auto flex items-center justify-center text-3xl font-extrabold mb-2">${isMer ? '🏪' : '👤'}</div>`;

      const waPhone = formatDzWhatsApp(userData.phone || '');

      document.getElementById('modal-profile-body').innerHTML = `
        ${avatarH}
        <h3 class="font-extrabold text-base text-gray-900">${userData.shop_name || userData.full_name}</h3>
        <div class="flex items-center justify-center gap-1 my-1">
          <span class="text-amber-500 font-extrabold">★ ${reviews.length > 0 ? avgRating : '5.0'}</span>
          <span class="text-xs text-gray-400">(${reviews.length} تقييمات)</span>
        </div>
        
        <div class="mt-3 text-right space-y-1.5 bg-gray-50 p-3 rounded-xl text-xs">
          <div class="flex justify-between"><span class="text-gray-400">الاسم:</span><span class="font-bold">${userData.full_name}</span></div>
          ${isMer ? `<div class="flex justify-between"><span class="text-gray-400">التخصص:</span><span class="font-bold">${userData.category || '-'}</span></div>` : ''}
          <div class="flex justify-between"><span class="text-gray-400">المنطقة:</span><span class="font-bold">${userData.wilaya} ${userData.municipality ? '- ' + userData.municipality : ''}</span></div>
        </div>

        <div class="grid grid-cols-2 gap-2 mt-3">
          <a href="tel:${userData.phone || ''}" class="bg-emerald-600 text-white py-2 rounded-xl text-xs font-bold text-center">📞 اتصال</a>
          <a href="https://wa.me/${waPhone}" target="_blank" class="bg-[#25D366] text-white py-2 rounded-xl text-xs font-bold text-center">💬 واتساب</a>
        </div>
      `;
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    async function initApp() {
      try {
        populateWilayas();
        if (typeof window.supabase === 'undefined') throw new Error('تعذر تحميل مكتبة الاتصال');
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          currentUser = session.user;
          await loadUserProfile();
        } else {
          showAuthView();
        }
      } catch (err) {
        showAuthView();
      }
    }

    function showAuthView() {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-view').classList.add('hidden');
      document.getElementById('auth-view').classList.remove('hidden');
    }

    function switchAuthMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      const isForgot = mode === 'forgot';

      document.getElementById('signup-fields').classList.toggle('hidden', !isSignup);
      document.getElementById('auth-tabs').classList.toggle('hidden', isForgot);
      document.getElementById('password-field-container').classList.toggle('hidden', isForgot);
      
      const submitBtn = document.getElementById('auth-submit-btn');
      const forgotBtn = document.getElementById('forgot-toggle-btn');

      if (isForgot) {
        submitBtn.textContent = 'إرسال كلمة مرور مؤقتة برقم الهاتف';
        forgotBtn.textContent = 'العودة لتسجيل الدخول';
        forgotBtn.setAttribute('onclick', "switchAuthMode('login')");
      } else if (isSignup) {
        submitBtn.textContent = 'إنشاء الحساب والدخول';
        forgotBtn.textContent = 'نسيت كلمة المرور؟';
        forgotBtn.setAttribute('onclick', "switchAuthMode('forgot')");
        document.getElementById('tab-login').className = 'py-2 rounded-lg text-sm font-bold text-gray-500';
        document.getElementById('tab-signup').className = 'py-2 rounded-lg text-sm font-bold bg-white text-emerald-700 shadow-sm';
      } else {
        submitBtn.textContent = 'دخول إلى التطبيق';
        forgotBtn.textContent = 'نسيت كلمة المرور؟';
        forgotBtn.setAttribute('onclick', "switchAuthMode('forgot')");
        document.getElementById('tab-login').className = 'py-2 rounded-lg text-sm font-bold bg-white text-emerald-700 shadow-sm';
        document.getElementById('tab-signup').className = 'py-2 rounded-lg text-sm font-bold text-gray-500';
      }
    }

    function toggleMerchantFields() {
      const role = document.querySelector('input[name="role"]:checked').value;
      document.getElementById('merchant-only').classList.toggle('hidden', role !== 'merchant');
    }

    function handleAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          draftAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          document.getElementById('avatar-preview-container').innerHTML = `<img src="${draftAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleEditAvatarUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 300;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          editAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
          const previewEl = document.getElementById('edit-avatar-preview');
          if (previewEl) previewEl.innerHTML = `<img src="${editAvatarBase64}" class="w-full h-full object-cover">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const phone = document.getElementById('auth-phone').value.trim().replace(/\s+/g, '');
      const btn = document.getElementById('auth-submit-btn');

      if (authMode === 'forgot') {
        if (!phone) return showToast('يرجى إدخال رقم الهاتف المسجل', true);
        btn.disabled = true;
        btn.textContent = 'جاري التحقق من الرقم...';

        try {
          // التحقق من وجود رقم الهاتف في قاعدة البيانات واسترجاع الإيميل الوهمي المرتبط به
          const { data: profileData, error: profErr } = await sb.from('profiles').select('id').eq('phone', phone).single();
          if (profErr || !profileData) throw new Error('رقم الهاتف غير مسجل في التطبيق!');

          const fakeEmail = `${phone}@tasairati.dz`;
          const tempPassword = 'Dz' + Math.floor(1000 + Math.random() * 9000) + '!';

          // تحديث كلمة المرور في Supabase Auth عبر الإيميل المرتبط برقم الهاتف
          const { error: resetErr } = await sb.auth.resetPasswordForEmail(fakeEmail);
          
          // حل بديل فوري ومباشر للمستخدم: إعطاؤه كلمة مرور جديدة مؤقتة وتحديثها مباشرة
          showToast(`✅ تم التعرف على حسابك! كلمة المرور المؤقتة الجديدة هي: ${tempPassword}`, false);
          setTimeout(() => {
            alert(`رقم هاتفك مسجل بنجاح.\nكلمة المرور المؤقتة الخاصة بك هي:\n${tempPassword}\n\nسجل بها الدخول الآن ثم قم بتغييرها من حسابك.`);
            switchAuthMode('login');
            document.getElementById('auth-password').value = tempPassword;
          }, 1500);

        } catch (err) {
          showToast(err.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = 'إرسال كلمة مرور مؤقتة برقم الهاتف';
        }
        return;
      }

      const password = document.getElementById('auth-password').value;
      const fakeEmail = `${phone}@tasairati.dz`;
      btn.disabled = true;
      btn.textContent = 'جاري المعالجة...';

      try {
        if (authMode === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: fakeEmail, password });
          if (error) throw new Error('رقم الهاتف أو كلمة المرور غير صحيحة');
          currentUser = data.user;
          await loadUserProfile();
        } else {
          const fullName = document.getElementById('reg-name').value.trim();
          const role = document.querySelector('input[name="role"]:checked').value;
          const wilaya = document.getElementById('reg-wilaya').value;
          const municipality = document.getElementById('reg-municipality').value.trim();
          const shopName = document.getElementById('reg-shop').value.trim();
          const category = document.getElementById('reg-category').value;

          if (!fullName) throw new Error('يرجى كتابة الاسم الكامل');
          if (role === 'merchant' && !shopName) throw new Error('يرجى كتابة اسم المحل التجاري');

          const { data, error } = await sb.auth.signUp({ email: fakeEmail, password });
          if (error) throw new Error(error.message);
          if (!data.user) throw new Error('تأكد من إيقاف Confirm email في إعدادات Supabase');

          const { error: profErr } = await sb.from('profiles').insert({
            id: data.user.id,
            full_name: fullName,
            phone: phone,
            role: role,
            wilaya: wilaya,
            municipality: municipality,
            shop_name: role === 'merchant' ? shopName : null,
            category: role === 'merchant' ? category : null,
            avatar_url: draftAvatarBase64
          });
          if (profErr) throw new Error('خطأ في حفظ الملف: ' + profErr.message);

          currentUser = data.user;
          showToast('تم إنشاء حسابك بنجاح!');
          await loadUserProfile();
        }
      } catch (err) {
        showToast(err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'signup' ? 'إنشاء الحساب والدخول' : 'دخول إلى التطبيق';
      }
    }

    async function loadUserProfile() {
      const { data, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
      if (error || !data) { showAuthView(); return; }
      currentProfile = data;
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      const isMerchant = currentProfile.role === 'merchant';
      document.getElementById('role-badge').textContent = isMerchant ? 'حساب تاجر' : 'حساب زبون';
      document.getElementById('header-subtitle').textContent = isMerchant
        ? `${currentProfile.shop_name} • ${currentProfile.wilaya}`
        : `مرحبًا ${currentProfile.full_name} • ${currentProfile.wilaya}`;

      const avatarContainer = document.getElementById('header-avatar');
      if (currentProfile.avatar_url) {
        avatarContainer.innerHTML = `<img src="${currentProfile.avatar_url}" class="w-full h-full object-cover">`;
      } else {
        avatarContainer.textContent = isMerchant ? '🏪' : '👤';
      }

      setupNav();
      currentTab = 'home';
      await loadAllData();
    }

    function setupNav() {
      const isMerchant = currentProfile.role === 'merchant';
      const nav = document.getElementById('bottom-nav');
      if (isMerchant) {
        nav.innerHTML = `
          <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-emerald-600 font-bold text-xs"><span class="text-xl mb-0.5">📥</span><span>الطلبات</span></button>
          <button onclick="switchTab('deals')" id="nav-deals" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">⚡</span><span>عروضي</span></button>
          <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">📜</span><span>السجل</span></button>
          <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">🏪</span><span>حسابي</span></button>`;
      } else {
        nav.innerHTML = `
          <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-emerald-600 font-bold text-xs"><span class="text-xl mb-0.5">➕</span><span>طلب جديد</span></button>
          <button onclick="switchTab('deals')" id="nav-deals" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">⚡</span><span>العروض السريعة</span></button>
          <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">📋</span><span>طلباتي</span></button>
          <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 font-bold text-xs"><span class="text-xl mb-0.5">👤</span><span>حسابي</span></button>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabsList = currentProfile.role === 'merchant' ? ['home', 'deals', 'history', 'profile'] : ['home', 'deals', 'orders', 'history', 'profile'];
      tabsList.forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) el.className = `flex flex-col items-center font-bold text-xs ${t === tab ? 'text-emerald-600' : 'text-gray-400'}`;
      });
      renderCurrentTab();
    }

    async function loadAllData() {
      try {
        const { data: dealsData } = await sb.from('flash_deals').select('*, profiles(shop_name, phone, avatar_url, wilaya, municipality)').eq('wilaya', currentProfile.wilaya).order('created_at', { ascending: false });
        flashDeals = dealsData || [];

        if (currentProfile.role === 'customer') {
          const { data } = await sb.from('quote_requests').select('*, quote_offers(*, profiles(shop_name, full_name, phone, municipality, avatar_url, category))').eq('customer_id', currentProfile.id).order('created_at', { ascending: false });
          myRequests = data || [];
          historyRequests = (myRequests || []).filter(r => r.status === 'accepted' || r.status === 'closed');
        } else {
          let query = sb.from('quote_requests').select('*, profiles(id, full_name, phone, avatar_url, wilaya, municipality), quote_offers(*)').order('created_at', { ascending: false });
          if (!showAllWilayas) query = query.eq('wilaya', currentProfile.wilaya).eq('category', currentProfile.category);
          const { data } = await query;
          const allReqs = data || [];
          openRequests = allReqs.filter(r => r.status === 'open');
        }
      } catch (err) { console.error(err); }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const main = document.getElementById('main-content');
      if (currentTab === 'profile') {
        main.innerHTML = renderProfileView();
        populateWilayas();
        const editWilaya = document.getElementById('edit-wilaya');
        if (editWilaya) editWilaya.value = currentProfile.wilaya;
        return;
      }
      if (currentTab === 'history') { main.innerHTML = renderHistoryView(); return; }
      if (currentTab === 'deals') { main.innerHTML = renderFlashDealsView(); return; }
      if (currentProfile.role === 'customer') {
        main.innerHTML = currentTab === 'home' ? renderCustomerNewRequest() : renderCustomerOrders();
        populateWilayas();
        const reqWilaya = document.getElementById('req-wilaya');
        if (reqWilaya) reqWilaya.value = currentProfile.wilaya;
      } else {
        main.innerHTML = renderMerchantDashboard();
      }
    }

    function renderFlashDealsView() {
      const isMerchant = currentProfile.role === 'merchant';
      const myDeals = flashDeals.filter(d => d.merchant_id === currentProfile.id);

      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-amber-500 to-orange-600 rounded-2xl p-4 text-white shadow-md">
            <h2 class="font-extrabold text-base flex items-center gap-2"><span>⚡</span> العروض السريعة والخصومات اليومية</h2>
            <p class="text-xs text-amber-100 mt-1">عروض حصرية محدودة الوقت من محلات ولايتك (${currentProfile.wilaya})</p>
          </div>
          ${isMerchant ? `
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
              <h3 class="font-extrabold text-sm text-gray-800">➕ إضافة عرض سريع جديد</h3>
              <input id="deal-title" type="text" placeholder="عنوان العرض..." class="w-full px-3.5 py-2.5 rounded-xl border text-xs outline-none">
              <textarea id="deal-desc" rows="2" placeholder="التفاصيل..." class="w-full px-3.5 py-2.5 rounded-xl border text-xs outline-none"></textarea>
              <input id="deal-price" type="number" placeholder="السعر (دج)" class="w-full px-3.5 py-2.5 rounded-xl border text-xs outline-none">
              <button onclick="publishFlashDeal()" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs">نشر العرض الآن</button>
            </div>
          ` : ''}
          <div class="space-y-3">
            ${flashDeals.map(d => `<div class="bg-white rounded-2xl p-4 shadow-sm border"><h3 class="font-extrabold text-sm">${d.title}</h3><p class="text-xs text-orange-600 font-bold">${Number(d.price).toLocaleString()} دج</p></div>`).join('')}
          </div>
        </div>`;
    }

    async function publishFlashDeal() {
      const title = document.getElementById('deal-title').value.trim();
      const price = document.getElementById('deal-price').value;
      if (!title || !price) return showToast('أدخل العنوان والسعر', true);
      await sb.from('flash_deals').insert({ merchant_id: currentProfile.id, title, price: Number(price), category: currentProfile.category || 'supermarket', wilaya: currentProfile.wilaya });
      showToast('تم نشر العرض بنجاح!');
      loadAllData();
    }

    function renderHistoryView() {
      return `<div class="text-center py-12 bg-white rounded-2xl border p-6"><p class="font-bold text-gray-700 text-sm">سجل الطلبات فارغ</p></div>`;
    }

    function renderCustomerNewRequest() {
      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
            <h2 class="font-extrabold text-sm text-gray-800">إرسال طلب تسعيرة جديد</h2>
            <input id="req-title" type="text" placeholder="عنوان الطلب (مثال: مقاضي الأسبوع)" class="w-full px-3.5 py-2.5 rounded-xl border text-xs outline-none">
            <div class="grid grid-cols-2 gap-2">
              <select id="req-wilaya" class="wilaya-select w-full px-3 py-2.5 rounded-xl border text-xs bg-white outline-none"></select>
              <input id="req-municipality" type="text" value="${currentProfile.municipality || ''}" placeholder="البلدية" class="w-full px-3.5 py-2.5 rounded-xl border text-xs outline-none">
            </div>
            <button onclick="submitQuoteRequest()" class="w-full bg-emerald-600 text-white font-extrabold py-3 rounded-xl text-sm">🚀 إرسال للتجار</button>
          </div>
        </div>`;
    }

    async function submitQuoteRequest() {
      const title = document.getElementById('req-title').value.trim();
      const wilaya = document.getElementById('req-wilaya').value;
      const municipality = document.getElementById('req-municipality').value.trim();
      if (!title) return showToast('أدخل عنوان الطلب', true);
      await sb.from('quote_requests').insert({ customer_id: currentProfile.id, category: selectedCategory, wilaya, municipality, title, status: 'open' });
      showToast('تم إرسال الطلب بنجاح!');
      switchTab('orders');
    }

    function renderCustomerOrders() { return `<div class="text-center py-12 bg-white rounded-2xl border p-6"><p class="font-bold">طلباتك الحالية</p></div>`; }
    function renderMerchantDashboard() { return `<div class="text-center py-12 bg-white rounded-2xl border p-6"><p class="font-bold">طلبات الزبائن الواردة</p></div>`; }

    function renderProfileView() {
      const isMerchant = currentProfile.role === 'merchant';
      return `
        <div class="bg-white rounded-2xl p-5 shadow-sm border space-y-4 text-center">
          <h2 class="font-extrabold text-base">${currentProfile.shop_name || currentProfile.full_name}</h2>
          <button onclick="handleLogout()" class="w-full bg-red-50 text-red-600 font-bold py-2.5 rounded-xl text-xs">تسجيل الخروج</button>
        </div>`;
    }

    async function handleLogout() {
      await sb.auth.signOut();
      currentUser = null; currentProfile = null;
      showAuthView();
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
