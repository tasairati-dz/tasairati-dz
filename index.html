    function formatDzWhatsApp(phone) {
      if (!phone) return '';
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '213' + clean.substring(1);
      else if (!clean.startsWith('213')) clean = '213' + clean;
      return clean;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.className = `px-4 py-3 rounded-xl shadow-lg text-white text-sm font-bold text-center ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    function populateWilayas() {
      document.querySelectorAll('.wilaya-select').forEach(sel => {
        const curVal = sel.value;
        sel.innerHTML = WILAYAS.map(w => `<option value="${w}">${w}</option>`).join('');
        if (curVal) sel.value = curVal;
      });
    }

    async function requestNotificationPermission() {
      if (!("Notification" in window)) {
        return showToast('متصفحك لا يدعم الإشعارات الفورية', true);
      }
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        showToast('✅ تم تفعيل الإشعارات الفورية بنجاح!');
        new Notification("تسعيرتي DZ", { body: "تم تفعيل تنبيهات العروض والطلبات بنجاح!", icon: "https://via.placeholder.com/128" });
      } else {
        showToast('يرجى السماح بالإشعارات من إعدادات المتصفح', true);
      }
    }

    function triggerBackgroundNotification(title, body) {
      if (Notification.permission === "granted") {
        try {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body: body,
              icon: "https://via.placeholder.com/128",
              badge: "https://via.placeholder.com/128",
              vibrate: [200, 100, 200]
            });
          }).catch(() => {
            new Notification(title, { body });
          });
        } catch (e) {
          new Notification(title, { body });
        }
      }
    }

    function requestUserGPSLocation() {
      if (!navigator.geolocation) return showToast('متصفحك لا يدعم تحديد الموقع', true);
      showToast('📍 جاري تحديد موقعك الفعلي المباشر...');
      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        if (currentProfile) {
          await sb.from('profiles').update({ latitude: lat, longitude: lon }).eq('id', currentProfile.id);
          currentProfile.latitude = lat;
          currentProfile.longitude = lon;
        }
        showToast('✅ تم تثبيت موقعك المباشر بنجاح!');
      }, (error) => {
        showToast('يرجى السماح بالوصول للموقع من المتصفح', true);
      }, { timeout: 10000 });
    }

      const reviews = reviewsData || [];
      let avgRating = 5;
      if (reviews.length > 0) {
        const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
        avgRating = (sum / reviews.length).toFixed(1);
      }

      const isMer = userData.role === 'merchant';
      const avatarH = userData.avatar_url 
        ? `<img src="${userData.avatar_url}" class="w-20 h-20 rounded-full object-cover mx-auto border-2 border-emerald-500 shadow-sm mb-2">`
        : `<div class="w-20 h-20 bg-emerald-100 text-emerald-700 rounded-full mx-auto flex items-center justify-center text-3xl font-extrabold mb-2">${isMer ? '🏪' : '👤'}</div>`;

      const waPhone = formatDzWhatsApp(userData.phone || '');

      document.getElementById('modal-profile-body').innerHTML = `
        ${avatarH}
        <h3 class="font-extrabold text-base text-gray-900">${userData.shop_name || userData.full_name}</h3>
        <div class="flex items-center justify-center gap-1 my-1">
          <span class="text
